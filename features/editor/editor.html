<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chỉnh sửa bộ đề</title>
    <link rel="icon" type="image/png" href="../../assets/favicons/favicon-editor.png">
    <script src="../../pwa-install.js" defer></script>
    <!-- Tailwind chỉ còn phục vụ hộp toast / xác nhận dùng chung (core/utils.js); giao diện trang nằm hết trong editor.css -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="editor.css?v=2">
</head>
<body class="ed-page">
    <div class="ed-shell">
        <!-- ĐẦU TRANG: dải giấy kem viền may, dính trên cùng -->
        <header class="ed-header">
            <a href="../../index.html#libraryContent" class="ed-back" title="Về thư viện" aria-label="Về thư viện"><i class="fas fa-arrow-left"></i></a>
            <img src="../../assets/logo.png" alt="" class="ed-logo" />
            <div class="ed-htext">
                <h1 class="ed-htitle">Sửa bộ đề</h1>
                <div id="save-status" class="ed-save-status saved" role="status" aria-live="polite">
                    <span class="dot"></span><span class="label">Đã lưu</span>
                </div>
            </div>
            <div class="ed-hactions">
                <button type="button" id="ed-paste-btn" class="ed-hbtn" title="Dán nhiều câu một lần"><i class="fas fa-paste"></i><span>Dán nhanh</span></button>
                <button type="button" id="ed-preview-btn" class="ed-hbtn" aria-pressed="false" title="Xem trước Markdown cạnh ô nhập"><i class="fas fa-eye"></i><span>Xem trước</span></button>
                <a id="ed-play-btn" class="ed-hbtn" href="#" hidden title="Lưu rồi làm thử bộ đề"><i class="fas fa-play"></i><span>Làm thử</span></a>
                <button type="button" id="save-quiz-btn" class="ed-save" title="Lưu (Ctrl+S)">
                    <i class="fas fa-floppy-disk"></i><span>Lưu</span><kbd>Ctrl S</kbd>
                </button>
            </div>
        </header>

        <!-- CUỐN SỔ MỞ: trang trái = danh sách câu, gáy lò xo, trang phải = sửa câu (editor.js vẽ) -->
        <main id="editor-container" class="ed-main">
            <div class="ed-app ed-skel" aria-label="Đang tải">
                <aside class="ed-rail"><div class="ed-skel-meta"><i style="width:70%"></i><i style="width:45%"></i></div>
                    <div class="ed-skel-rows"><i></i><i></i><i></i><i></i><i></i></div></aside>
                <div class="ed-binding" aria-hidden="true"></div>
                <section class="ed-stage"><div class="ed-skel-card"><i style="width:20%"></i><i style="width:90%"></i><i style="width:70%"></i><i style="width:76%"></i><i style="width:60%"></i></div></section>
            </div>
        </main>
    </div>

    <!-- THANH DƯỚI (điện thoại): màn danh sách = Câu mới · Dán nhanh · Lưu; màn sửa = ‹ · Danh sách · › · Lưu -->
    <nav class="ed-dock" aria-label="Thao tác nhanh">
        <button type="button" id="dock-add" class="on-list"><i class="fas fa-circle-plus"></i><span>Câu mới</span></button>
        <button type="button" id="dock-paste" class="on-list"><i class="fas fa-paste"></i><span>Dán nhanh</span></button>
        <button type="button" id="dock-prev" class="on-detail" aria-label="Câu trước"><i class="fas fa-chevron-left"></i><span>Trước</span></button>
        <button type="button" id="dock-list" class="on-detail"><i class="fas fa-list-ul"></i><span>Danh sách</span></button>
        <button type="button" id="dock-next" class="on-detail" aria-label="Câu sau"><i class="fas fa-chevron-right"></i><span>Sau</span></button>
        <button type="button" id="fab-save" class="ed-dock-save" aria-label="Lưu thay đổi"><i class="fas fa-floppy-disk"></i><span>Lưu</span></button>
    </nav>
    <button type="button" id="ed-top" class="ed-top" title="Lên đầu trang" aria-label="Lên đầu trang"><i class="fas fa-arrow-up"></i></button>
    <div id="ed-snack" class="ed-snack" role="status" hidden></div>

    <div id="toast-container"></div>
    <script type="module" src="editor.js"></script>
    <!-- Bắt buộc đăng nhập: khách sẽ thấy lớp chặn thay vì làm rồi mất dữ liệu -->
    <script type="module">
        import { guardPage } from '../../core/require-login.js';
        guardPage('Sửa bộ đề');
    </script>
</body>
</html>
