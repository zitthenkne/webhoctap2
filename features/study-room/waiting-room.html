<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bệnh án của tôi</title>
    <link rel="icon" type="image/png" href="../../assets/logo.png">
    <script src="../../pwa-install.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../core/app-sidebar.css?v=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Giao diện vùng bệnh án (bố cục 2 cột: đợt thực hành | bệnh án) -->
    <link rel="stylesheet" href="waiting-room.css?v=4">
</head>

<body class="flex h-screen text-gray-700 text-sm">
    <!-- Mobile Top Bar with Hamburger -->
    <div id="wr-topbar"
        class="md:hidden fixed top-0 left-0 w-full z-40 bg-[#fff9fb] flex items-center justify-between border-b-2 border-dashed border-pink-200">
        <div class="flex items-center gap-1 min-w-0">
            <button id="menu-toggle-btn" class="text-xl text-pink-500 focus:outline-none w-11 h-11 grid place-items-center rounded-2xl flex-shrink-0" aria-label="Mở thanh bên">
                <i class="fas fa-bars"></i>
            </button>
            <a href="../../index.html" class="flex items-center gap-1 min-w-0">
                <img src="../../assets/logo.png" alt="Zitthenkne Logo"
                    class="w-10 h-10 hover:scale-105 transition-transform duration-200 flex-shrink-0">
                <span class="font-extrabold text-[#FF69B4] text-xl truncate block md:hidden">Zitthenkne</span>
            </a>
        </div>
        <img id="user-avatar-mobile" src="https://ui-avatars.com/api/?name=?&background=D8BFD8&color=fff"
            class="w-9 h-9 rounded-full border-2 border-[#D8BFD8] shadow ml-1 flex-shrink-0">
    </div>
    <!-- Overlay for sidebar on mobile -->
    <div id="sidebar-overlay"
        class="fixed inset-0 bg-[#f472b6]/25 z-30 hidden md:hidden transition-opacity duration-200"></div>
    <aside id="sidebar"
        class="w-11/12 max-w-xs bg-white shadow-xl fixed md:relative z-40 h-full transition-transform duration-300 ease-in-out rounded-r-3xl border-r-2 border-pink-100 top-0 left-0 md:static md:translate-x-0 -translate-x-full md:rounded-none md:block"></aside>
    <!-- Thanh bên dùng chung với trang chủ (core/app-sidebar.js) -->
    <script src="../../core/app-sidebar.js?v=1"></script>
    <div id="wr-shell" class="flex-1 flex flex-col overflow-hidden">
        <header class="wr-top hidden md:block">
            <div class="container mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <h2 class="wr-top-title"><img src="../quiz/web_assets/badge_stationery_study.webp" alt="" class="wr-top-sticker" width="42" height="42">Bệnh án của tôi</h2>
                </div>
                <div id="user-menu-button" class="relative">
                    <button
                        class="flex items-center gap-2 hover:bg-pink-50 px-4 py-2 rounded-2xl transition shadow border-2 border-transparent hover:border-[#FFB6C1]">
                        <span id="user-name" class="text-gray-700 font-semibold text-lg">Khách</span>
                        <img id="user-avatar" src="https://ui-avatars.com/api/?name=?&background=D8BFD8&color=fff"
                            class="w-10 h-10 rounded-full border-4 border-[#D8BFD8] shadow-lg hover:shadow-pink-200 transition-all duration-300">
                    </button>
                </div>
            </div>
        </header>
        <main id="wr-main" class="flex-1 overflow-x-hidden overflow-y-auto">
            <div class="wr-wrap">
                <!-- CỘT TRÁI: đợt thực hành. Điện thoại: bảng trượt từ đáy, mở bằng #folder-switch -->
                <aside id="folder-pane" class="fp" aria-label="Đợt thực hành">
                    <span class="fp-handle"></span>
                    <div class="fp-head">
                        <h3><i class="fas fa-folder-open"></i> Đợt thực hành</h3>
                        <button type="button" id="folder-new" class="fp-add" title="Tạo đợt thực hành mới"><i class="fas fa-plus"></i> Thêm</button>
                    </div>
                    <div id="folder-list"></div>
                </aside>
                <div class="fp-backdrop" id="fp-backdrop"></div>

                <!-- CỘT PHẢI: bệnh án trong phạm vi đang chọn -->
                <section class="wr-body">
                    <div class="wr-scope">
                        <div class="wr-scope-txt">
                            <button type="button" id="folder-switch" class="wr-switch" aria-controls="folder-pane">
                                <span class="sw-ico" id="scope-ico"><i class="fas fa-layer-group"></i></span>
                                <span class="sw-t" id="scope-title">Tất cả bệnh án</span>
                                <i class="fas fa-chevron-down sw-caret"></i>
                            </button>
                            <div class="wr-scope-sub">
                                <p id="scope-meta" class="wr-scope-meta"></p>
                                <!-- Trạng thái đồng bộ để ở đầu trang: mở ra là biết bệnh án đã lên mây chưa -->
                                <p id="sync-status" class="wr-sync" data-state="busy"><i class="fas fa-circle-notch fa-spin"></i> Đang tải…</p>
                            </div>
                        </div>
                        <div class="wr-scope-act">
                            <button type="button" id="scope-edit" class="wr-ghost hidden" title="Sửa thông tin đợt"><i class="fas fa-pen"></i><span>Sửa đợt</span></button>
                            <button type="button" id="create-new-record" class="wr-primary" aria-label="Tạo bệnh án mới" title="Tạo bệnh án mới (phím n)"><i class="fas fa-plus"></i><span>Tạo bệnh án</span></button>
                        </div>
                    </div>
                    <!-- Điện thoại / máy tính bảng: đổi đợt một chạm (cùng dữ liệu với cột đợt, JS vẽ) -->
                    <div id="folder-chips" class="wr-chips" aria-label="Chọn đợt thực hành"></div>

                    <!-- Thanh công cụ: tìm · lọc trạng thái · ⋮ (sắp xếp, kiểu xem, đồng bộ, chọn nhiều, sao lưu) -->
                    <!-- KHÔNG thêm backdrop-blur/filter/transform cho các khung chứa nút tạo: nút nổi position:fixed sẽ bị neo sai -->
                    <div id="wr-tools" class="wr-tools">
                        <div class="wr-search-box">
                            <i class="fas fa-search"></i>
                            <input id="search-record" type="search" placeholder="Tìm tên, chẩn đoán, phòng…" class="wr-search" autocomplete="off" />
                            <span class="wr-kbd">/</span>
                        </div>
                        <div id="stat-filter" class="wr-seg" role="group" aria-label="Lọc theo trạng thái">
                            <button type="button" data-filter="all" class="on">Tất cả <b id="stat-total">0</b></button>
                            <button type="button" data-filter="draft">Đang viết <b id="stat-draft">0</b></button>
                            <button type="button" data-filter="done">Hoàn thành <b id="stat-done">0</b></button>
                        </div>
                        <div class="wr-tools-end">
                            <button type="button" id="more-menu-btn" class="wr-icon-btn" aria-label="Tùy chọn khác" title="Sắp xếp, kiểu xem, đồng bộ, sao lưu"><i class="fas fa-sliders"></i></button>
                            <div id="more-menu" class="wr-menu hidden">
                                <div class="wr-menu-sec">
                                    <span>Sắp xếp</span>
                                    <select id="sort-record" aria-label="Sắp xếp danh sách">
                                        <option value="new">Sửa gần nhất</option>
                                        <option value="old">Sửa lâu nhất</option>
                                        <option value="name">Tên A → Z</option>
                                    </select>
                                </div>
                                <div class="wr-menu-sec">
                                    <span>Kiểu xem <small class="normal-case tracking-normal font-semibold">(phím v)</small></span>
                                    <div class="wr-seg" id="view-toggle" role="group" aria-label="Kiểu xem">
                                        <button type="button" data-view="grid" class="on"><i class="fas fa-table-cells-large"></i> Thẻ</button>
                                        <button type="button" data-view="compact"><i class="fas fa-list"></i> Danh sách</button>
                                    </div>
                                </div>
                                <hr>
                                <button type="button" id="select-toggle" class="wr-menu-item" aria-pressed="false"><i class="fas fa-check-double"></i><span class="flex-1">Chọn nhiều bệnh án<small class="wr-menu-hint">hoặc nhấn giữ một thẻ</small></span></button>
                                <button type="button" id="sync-now" class="wr-menu-item" title="Kéo bệnh án từ máy khác về và đẩy bệnh án ở máy này lên"><i class="fas fa-cloud-arrow-up"></i> Đồng bộ ngay</button>
                                <hr>
                                <button type="button" id="export-json" class="wr-menu-item"><i class="fas fa-file-export"></i> Xuất file sao lưu</button>
                                <button type="button" id="import-json" class="wr-menu-item"><i class="fas fa-file-import"></i> Nhập file sao lưu</button>
                                <input id="import-file" type="file" accept="application/json,.json" class="hidden">
                                <hr>
                                <button type="button" id="toggle-guide" class="wr-menu-item" title="Ẩn / hiện mọi câu hướng dẫn trong trang viết bệnh án — áp dụng cho tất cả bệnh án">
                                    <i class="fas fa-graduation-cap"></i><span class="flex-1">Chế độ hướng dẫn</span>
                                    <span id="guide-state" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-pink-100 text-pink-600">Bật</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div id="resume-slot"></div>

                    <div id="medical-record-cards">
                        <!-- JS vẽ bệnh án ở đây (nhóm theo đợt khi đang xem Tất cả) -->
                    </div>
                </section>
            </div>
            <div id="move-modal"
                class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
                <div class="absolute inset-0 bg-[#db2777]/25" data-move-close></div>
                <div
                    class="relative bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl shadow-xl border-2 border-pink-100 p-5 max-h-[85vh] overflow-y-auto">
                    <h3 class="text-lg font-extrabold text-pink-600 mb-1 flex items-center gap-2"><i
                            class="fas fa-folder-tree"></i> Chuyển sang đợt khác</h3>
                    <p id="move-subject" class="text-xs text-gray-400 mb-3"></p>
                    <div id="move-list" class="flex flex-col gap-2"></div>
                    <div class="flex items-center gap-2 mt-4">
                        <button id="move-new" class="mr-auto text-sm font-semibold text-pink-600 hover:text-pink-700"><i
                                class="fas fa-plus mr-1"></i>Đợt mới</button>
                        <button class="px-4 py-2.5 rounded-xl border-2 border-pink-100 text-gray-500 font-semibold"
                            data-move-close>Đóng</button>
                    </div>
                </div>
            </div>

            <div id="folder-modal"
                class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
                <div class="absolute inset-0 bg-[#db2777]/25" data-folder-close></div>
                <div
                    class="relative bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl shadow-xl border-2 border-pink-100 p-5 max-h-[90vh] overflow-y-auto">
                    <h3 class="text-lg font-extrabold text-pink-600 mb-3 flex items-center gap-2"><i
                            class="fas fa-folder-plus"></i> <span id="folder-modal-title">Đợt thực hành</span>
                    </h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <label class="text-xs font-semibold text-gray-500 sm:col-span-2">Tên đợt
                            <input id="folder-name" type="text"
                                class="mt-1 w-full border-2 border-pink-100 rounded-xl px-3 py-2 text-base text-gray-700 focus:outline-none focus:ring-2 focus:ring-pink-200"
                                placeholder="vd: Lâm sàng Nội 1 – đợt 2">
                        </label>
                        <label class="text-xs font-semibold text-gray-500">Chuyên khoa
                            <select id="folder-kind"
                                class="mt-1 w-full border-2 border-pink-100 rounded-xl px-3 py-2 text-base text-gray-700 focus:outline-none focus:ring-2 focus:ring-pink-200">
                                <option value="">— để máy tự đoán theo tên khoa —</option>
                                <option value="noi">Nội khoa</option>
                                <option value="ngoai">Ngoại khoa</option>
                                <option value="san">Sản khoa</option>
                                <option value="nhi">Nhi khoa</option>
                                <option value="cc">Cấp cứu</option>
                            </select>
                        </label>
                        <label class="text-xs font-semibold text-gray-500">Khoa
                            <input id="folder-dept" type="text"
                                class="mt-1 w-full border-2 border-pink-100 rounded-xl px-3 py-2 text-base text-gray-700 focus:outline-none focus:ring-2 focus:ring-pink-200"
                                placeholder="vd: Khoa Nội tiêu hóa">
                        </label>
                        <label class="text-xs font-semibold text-gray-500">Bệnh viện
                            <input id="folder-hospital" type="text"
                                class="mt-1 w-full border-2 border-pink-100 rounded-xl px-3 py-2 text-base text-gray-700 focus:outline-none focus:ring-2 focus:ring-pink-200"
                                placeholder="vd: BV Chợ Rẫy">
                        </label>
                        <label class="text-xs font-semibold text-gray-500">Từ ngày
                            <input id="folder-from" type="date"
                                class="mt-1 w-full border-2 border-pink-100 rounded-xl px-3 py-2 text-base text-gray-700 focus:outline-none focus:ring-2 focus:ring-pink-200">
                        </label>
                        <label class="text-xs font-semibold text-gray-500">Đến ngày
                            <input id="folder-to" type="date"
                                class="mt-1 w-full border-2 border-pink-100 rounded-xl px-3 py-2 text-base text-gray-700 focus:outline-none focus:ring-2 focus:ring-pink-200">
                        </label>
                    </div>
                    <p class="text-[11px] text-gray-400 mt-2">Bệnh án tạo trong đợt này sẽ tự điền sẵn khoa, bệnh
                        viện và <b>tự chuyển sang đúng chuyên khoa</b> — khỏi bị hỏi lại mỗi lần viết bệnh án mới.</p>
                    <div class="flex items-center gap-2 mt-4">
                        <button id="folder-delete"
                            class="hidden mr-auto text-sm font-semibold text-red-500 hover:text-red-600"><i
                                class="fas fa-trash mr-1"></i>Xóa đợt</button>
                        <button class="px-4 py-2.5 rounded-xl border-2 border-pink-100 text-gray-500 font-semibold"
                            data-folder-close>Hủy</button>
                        <button id="folder-save"
                            class="px-5 py-2.5 rounded-xl bg-pink-500 text-white font-bold shadow-lg shadow-pink-200 hover:bg-pink-600">Lưu</button>
                    </div>
                </div>
            </div>

            <div id="bulk-bar" class="hidden">
                <span id="bulk-count">0 đã chọn</span>
                <button id="bulk-all"><i class="fas fa-check-double mr-1"></i>Chọn tất cả</button>
                <button id="bulk-move"><i class="fas fa-folder-tree mr-1"></i>Chuyển đợt</button>
                <select id="bulk-status" title="Đổi trạng thái">
                    <option value="">Trạng thái…</option>
                    <option value="Hoàn thành">Hoàn thành</option>
                    <option value="Đang chỉnh sửa">Đang viết</option>
                </select>
                <select id="bulk-kind" title="Đổi loại bệnh án">
                    <option value="">Loại bệnh án…</option>
                    <option value="noi">Nội khoa</option>
                    <option value="ngoai">Ngoại khoa</option>
                    <option value="san">Sản khoa</option>
                    <option value="nhi">Nhi khoa</option>
                    <option value="cc">Cấp cứu</option>
                </select>
                <button id="bulk-delete" class="danger"><i class="fas fa-trash mr-1"></i>Xóa</button>
                <button id="bulk-exit" title="Thoát chọn"><i class="fas fa-times"></i></button>
            </div>

            <div id="toast-container"
                class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center space-y-2 pointer-events-none">
            </div>
        </main>
    </div>
    <script type="module" src="waiting-room.js"></script>
  <!-- Bắt buộc đăng nhập: khách sẽ thấy lớp chặn thay vì làm rồi mất dữ liệu -->
  <script type="module">
    import { guardPage } from '../../core/require-login.js';
    guardPage('Danh sách bệnh án');
  </script>
</body>

</html>
