<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Phòng học Zitthenkne</title>
    <link rel="icon" type="image/png" href="../../assets/logo.png">
    <script src="../../pwa-install.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../quiz/quiz-enhance.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="flex flex-col h-screen bg-gray-100 text-gray-700 text-sm">
    <header class="bg-white shadow-sm px-2 sm:px-3 py-2 flex justify-between items-center gap-2 flex-shrink-0 z-20">
        <div class="flex items-center gap-1.5 sm:gap-3 min-w-0">
            <a href="../../index.html" class="p-2 text-gray-600 hover:text-pink-500 transition rounded-lg hover:bg-gray-100 flex items-center gap-2 shrink-0" title="Về trang chủ">
                <i class="fas fa-arrow-left"></i><span class="hidden md:inline">Trang chủ</span>
            </a>
            <div id="room-id-display" class="text-xs text-gray-500 bg-pink-50 px-2.5 py-1 rounded-lg font-mono truncate min-w-0"></div>
        </div>
        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
            <button id="start-collaborative-quiz-btn" class="px-3 sm:px-4 py-2 bg-[#FF69B4] text-white rounded-xl hover:bg-pink-400 transition text-xs sm:text-sm font-bold flex items-center gap-1.5 shadow-md">
                <i class="fas fa-users"></i><span>Đánh đề</span>
            </button>
            <button id="share-room-btn" class="px-3 sm:px-4 py-2 bg-white text-pink-500 border border-pink-200 rounded-xl hover:bg-pink-50 transition text-xs sm:text-sm font-bold flex items-center gap-1.5 shadow-sm">
                <i class="fas fa-share-alt"></i><span class="hidden sm:inline">Chia sẻ</span>
            </button>
            <button id="mobile-chat-toggle" class="md:hidden px-3 py-2 text-pink-500 bg-pink-50 border border-pink-100 rounded-xl focus:outline-none" title="Trò chuyện & thành viên">
                <i class="fas fa-comments"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 flex relative pt-2 md:pt-0">
        <div class="fixed bottom-0 left-0 w-full overflow-x-auto bg-white/95 shadow-lg flex flex-row items-center gap-1 px-1 py-2 z-30 md:absolute md:top-4 md:left-4 md:bg-white/80 md:backdrop-blur-md md:rounded-lg md:shadow-lg md:p-1 md:flex-col md:gap-2 md:static md:bottom-auto md:w-auto md:h-auto md:overflow-visible rounded-t-2xl md:rounded-lg md:z-10">
            <button data-tool="select" class="tool-btn p-2 w-12 h-12 flex items-center justify-center rounded hover:bg-gray-200 transition active text-xl md:w-10 md:h-10 md:text-base" title="Chọn"><i class="fas fa-mouse-pointer"></i></button>
            <button data-tool="pen" class="tool-btn p-2 w-12 h-12 flex items-center justify-center rounded hover:bg-gray-200 transition text-xl md:w-10 md:h-10 md:text-base" title="Bút"><i class="fas fa-pen"></i></button>
            <button data-tool="highlight" class="tool-btn p-2 w-12 h-12 flex items-center justify-center rounded hover:bg-yellow-100 transition text-xl md:w-10 md:h-10 md:text-base" title="Highlight"><i class="fas fa-highlighter"></i></button>
            <button data-tool="line" class="tool-btn p-2 w-12 h-12 flex items-center justify-center rounded hover:bg-gray-200 transition text-xl md:w-10 md:h-10 md:text-base" title="Đường thẳng"><i class="fas fa-minus"></i></button>
            <button data-tool="rectangle" class="tool-btn p-2 w-12 h-12 flex items-center justify-center rounded hover:bg-gray-200 transition text-xl md:w-10 md:h-10 md:text-base" title="Hình chữ nhật"><i class="far fa-square"></i></button>
            <button data-tool="circle" class="tool-btn p-2 w-12 h-12 flex items-center justify-center rounded hover:bg-gray-200 transition text-xl md:w-10 md:h-10 md:text-base" title="Hình tròn"><i class="far fa-circle"></i></button>
            <button data-tool="eraser" class="tool-btn p-2 w-12 h-12 flex items-center justify-center rounded hover:bg-gray-200 transition text-xl md:w-10 md:h-10 md:text-base" title="Tẩy"><i class="fas fa-eraser"></i></button>
            <input type="color" id="color-picker" value="#FF69B4" class="w-12 h-12 p-1 border-none rounded cursor-pointer bg-white md:w-10 md:h-10" title="Chọn màu">
            <input type="range" id="line-width" min="1" max="50" value="5" class="w-24 mx-auto my-2 md:w-20" title="Độ dày nét">
            <label class="flex items-center gap-2 px-2 cursor-pointer select-none text-xs" title="Nét đứt"><input type="checkbox" id="dashed-checkbox" class="accent-pink-400"> <span class="hidden md:inline">Nét đứt</span></label>
            <button id="undo-btn" class="p-2 w-12 h-12 flex items-center justify-center rounded hover:bg-gray-200 transition text-xl md:w-10 md:h-10 md:text-base" title="Hoàn tác"><i class="fas fa-undo"></i></button>
            <button id="redo-btn" class="p-2 w-12 h-12 flex items-center justify-center rounded hover:bg-gray-200 transition text-xl md:w-10 md:h-10 md:text-base" title="Làm lại"><i class="fas fa-redo"></i></button>
            <button id="clear-canvas-btn" class="p-2 w-12 h-12 flex items-center justify-center rounded hover:bg-red-100 transition text-red-500 text-xl md:w-10 md:h-10 md:text-base" title="Xóa bảng"><i class="fas fa-trash"></i></button>
            <button id="upload-image-object-btn" class="p-2 w-12 h-12 flex items-center justify-center rounded hover:bg-gray-200 transition text-xl md:w-10 md:h-10 md:text-base" title="Chèn ảnh"><i class="fas fa-image"></i></button>
            <input type="file" id="image-object-file-input" accept="image/*" class="hidden">
        </div>

        <div id="canvas-container" class="flex-1 relative w-full h-full bg-white rounded-lg shadow-inner flex items-center justify-center min-h-[300px] md:min-h-0 pt-2 pb-20 md:pb-0 md:pt-0">
            <canvas id="whiteboard" class="w-full h-full rounded-lg cursor-crosshair"></canvas>
        </div>

        <aside id="chat-sidebar" class="fixed md:absolute bottom-0 md:bottom-auto md:top-4 left-0 md:left-auto right-0 md:right-4 w-full md:w-80 max-w-full bg-white/95 rounded-t-2xl md:rounded-lg shadow-2xl md:shadow-lg flex flex-col z-40 md:z-20 h-[70vh] md:h-[90%] transition-transform duration-300 md:translate-x-0 translate-y-full md:translate-y-0 pointer-events-none md:pointer-events-auto md:block">
            <div class="flex flex-col h-full pointer-events-auto">
                <div class="flex items-center justify-between p-4 border-b border-pink-100">
                    <div class="font-bold text-[#FF69B4] flex items-center gap-2"><i class="fas fa-users"></i> <span>Trò chuyện & thành viên</span></div>
                    <span id="room-notice-area" class="text-xs text-gray-400"></span>
                </div>
                <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-2 bg-pink-50"></div>
                <ul id="member-list" class="h-40 overflow-y-auto p-4 space-y-2 bg-pink-100/50 border-t border-pink-200"></ul>
                <div class="border-t border-pink-100 p-4 bg-white rounded-b-lg">
                    <form id="chat-form" class="flex gap-2">
                        <input id="chat-input" type="text" placeholder="Nhắn tin..." class="flex-1 p-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-200">
                        <button type="submit" class="bg-[#FF69B4] text-white px-4 py-2 rounded-lg hover:bg-opacity-80 transition flex items-center gap-1"><i class="fas fa-paper-plane"></i></button>
                    </form>
                </div>
            </div>
        </aside>

        <div id="loading-overlay" class="absolute inset-0 bg-white/80 backdrop-blur-sm flex items-center justify-center z-50 hidden">
            <div class="flex flex-col items-center gap-4">
                <i class="fas fa-spinner fa-spin text-4xl text-[#FF69B4]"></i>
                <span class="text-[#FF69B4] font-semibold">Đang tải dữ liệu...</span>
            </div>
        </div>
    </main>

    <div id="collaborative-quiz-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-40 hidden px-2 py-3">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-5xl relative border border-pink-100 flex flex-col max-h-[96vh]">
            <!-- Header modal -->
            <div class="flex items-center gap-3 px-5 sm:px-7 pt-5 pb-4 border-b border-pink-100 shrink-0">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-[#FF69B4] to-[#D8BFD8] flex items-center justify-center text-white shadow-md shrink-0">
                    <i class="fas fa-users"></i>
                </div>
                <div class="min-w-0 flex-1">
                    <h2 class="text-lg font-extrabold text-gray-800 leading-tight">Cùng nhau đánh đề</h2>
                    <p id="quiz-modal-subtitle" class="text-xs text-gray-400 truncate">Tải đề lên hoặc chọn từ thư viện, cả phòng cùng giải</p>
                </div>
                <button id="close-collaborative-quiz-modal-btn" class="w-9 h-9 rounded-xl text-gray-400 hover:text-gray-700 hover:bg-gray-100 transition shrink-0" title="Đóng">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <div class="overflow-y-auto p-5 sm:p-7">
                <!-- Bước 1: nhập bộ đề -->
                <div id="quiz-upload-area">
                    <div id="upload-quiz-file-area"
                        class="group border-2 border-dashed border-[#FFB6C1] rounded-2xl p-8 text-center cursor-pointer hover:bg-pink-50/70 hover:border-[#FF69B4] transition mb-3">
                        <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-pink-50 flex items-center justify-center text-[#FF69B4] text-2xl group-hover:scale-110 transition-transform">
                            <i class="fas fa-file-arrow-up"></i>
                        </div>
                        <div class="font-bold text-[#FF69B4]">Thả file đề vào đây hoặc bấm để chọn</div>
                        <p class="text-xs text-gray-400 mt-1">Hỗ trợ Excel (.xlsx, .xls) — cột: câu hỏi, 4 đáp án, số đáp án đúng, giải thích</p>
                        <input type="file" id="quizFileInput" accept=".xlsx,.xls" class="hidden">
                    </div>
                    <div id="quizFileInfo" class="hidden mb-3">
                        <div class="inline-flex items-center gap-2 bg-pink-50 border border-pink-100 rounded-xl px-4 py-2.5 max-w-full">
                            <i class="fas fa-file-excel text-green-500"></i>
                            <span id="quizFileName" class="text-sm font-semibold text-gray-700 truncate"></span>
                            <span id="quiz-question-count-info" class="text-xs font-bold text-[#FF69B4] whitespace-nowrap"></span>
                        </div>
                    </div>
                    <!-- Chế độ đáp án -->
                    <div class="mb-4">
                        <p class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Chế độ đáp án</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <label class="quiz-mode-card flex items-start gap-3 p-3.5 rounded-xl border-2 border-pink-200 bg-pink-50/60 cursor-pointer transition has-[:checked]:border-[#FF69B4] has-[:checked]:bg-pink-50 has-[:checked]:shadow-sm">
                                <input type="radio" name="quiz-answer-mode" value="self" checked class="mt-1 accent-[#FF69B4]">
                                <span>
                                    <span class="block text-sm font-bold text-gray-800"><i class="fas fa-people-arrows text-[#FF69B4] mr-1.5"></i>Tự đánh với nhau</span>
                                    <span class="block text-xs text-gray-500 mt-0.5">Cả phòng bàn luận, chủ xị chốt đáp án — không lộ đáp án gốc</span>
                                </span>
                            </label>
                            <label class="quiz-mode-card flex items-start gap-3 p-3.5 rounded-xl border-2 border-blue-100 bg-blue-50/40 cursor-pointer transition has-[:checked]:border-blue-400 has-[:checked]:bg-blue-50 has-[:checked]:shadow-sm">
                                <input type="radio" name="quiz-answer-mode" value="reference" class="mt-1 accent-blue-500">
                                <span>
                                    <span class="block text-sm font-bold text-gray-800"><i class="fas fa-lightbulb text-blue-500 mr-1.5"></i>Tham khảo đáp án gốc</span>
                                    <span class="block text-xs text-gray-500 mt-0.5">Hiện sẵn đáp án đúng từ file/đề trong thư viện để cùng dò</span>
                                </span>
                            </label>
                        </div>
                    </div>
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                        <div class="flex flex-wrap gap-2">
                            <button id="download-quiz-template-btn" type="button"
                                class="px-4 py-2 bg-white text-gray-600 border border-gray-200 rounded-xl hover:bg-gray-50 transition text-sm font-bold flex items-center gap-2">
                                <i class="fas fa-download text-gray-400"></i> Tải file mẫu
                            </button>
                            <button id="library-quiz-btn" type="button"
                                class="px-4 py-2 bg-blue-50 text-blue-600 border border-blue-100 rounded-xl hover:bg-blue-100 transition text-sm font-bold flex items-center gap-2">
                                <i class="fas fa-book"></i> Chọn đề trong thư viện
                            </button>
                        </div>
                        <button id="start-quiz-collaboration-btn" disabled
                            class="px-6 py-2.5 bg-[#FF69B4] text-white rounded-xl hover:bg-pink-400 transition text-sm font-bold flex items-center justify-center gap-2 shadow-md disabled:opacity-40 disabled:cursor-not-allowed">
                            <i class="fas fa-play"></i> Bắt đầu cho cả phòng
                        </button>
                    </div>
                    <div id="library-quiz-list" class="mt-4"></div>
                </div>

                <!-- Bước 2: làm bài chung -->
                <div id="collaborative-quiz-display" class="hidden">
                    <div class="flex items-center justify-between gap-3 mb-3">
                        <div class="min-w-0">
                            <p id="quiz-session-title" class="font-extrabold text-gray-800 truncate text-base sm:text-lg"></p>
                            <p id="quiz-session-host" class="text-xs text-gray-400"></p>
                        </div>
                        <span id="question-counter"
                            class="shrink-0 text-sm font-bold text-[#FF69B4] bg-pink-50 border border-pink-100 rounded-full px-3.5 py-1.5 tabular-nums"></span>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-2 mb-5 overflow-hidden">
                        <div id="collaborative-quiz-progress-fill"
                            class="bg-gradient-to-r from-[#FF69B4] to-[#D8BFD8] h-2 rounded-full transition-all duration-300" style="width: 0%;"></div>
                    </div>
                    <div class="bg-pink-50/70 border border-pink-100 rounded-2xl p-5 sm:p-7 mb-5">
                        <p id="current-question-text" class="font-bold text-lg sm:text-2xl text-gray-800 leading-relaxed"></p>
                    </div>
                    <div id="quiz-options-area" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
                    <div id="quiz-explain-area"></div>
                    <div class="flex justify-between items-center gap-2 mt-6">
                        <button id="prev-question-btn" disabled
                            class="px-4 py-2.5 bg-gray-100 text-gray-600 rounded-xl hover:bg-gray-200 transition text-sm font-bold flex items-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed">
                            <i class="fas fa-arrow-left"></i><span class="hidden sm:inline"> Trước</span>
                        </button>
                        <button id="finish-quiz-collaboration-btn"
                            class="px-5 py-2.5 bg-green-500 text-white rounded-xl hover:bg-green-600 transition text-sm font-bold flex items-center gap-2 shadow-md hidden">
                            <i class="fas fa-check"></i> Hoàn thành &amp; Lưu
                        </button>
                        <button id="next-question-btn"
                            class="px-4 py-2.5 bg-[#FF69B4] text-white rounded-xl hover:bg-pink-400 transition text-sm font-bold flex items-center gap-2 shadow-sm disabled:opacity-40 disabled:cursor-not-allowed">
                            <span class="hidden sm:inline">Tiếp </span><i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script type="module" src="study-room-main.js"></script>
    
    <script>
    // Mobile chat sidebar toggle logic
    document.addEventListener('DOMContentLoaded', function() {
        const chatSidebar = document.getElementById('chat-sidebar');
        const chatToggle = document.getElementById('mobile-chat-toggle');
        if (chatSidebar && chatToggle) {
            chatToggle.addEventListener('click', () => {
                chatSidebar.classList.toggle('translate-y-full');
                chatSidebar.classList.toggle('md:translate-x-full');
            });
            // Đóng khi click ra ngoài trên mobile
            document.addEventListener('click', (e) => {
                if (window.innerWidth < 768 && chatSidebar && !chatSidebar.contains(e.target) && !chatToggle.contains(e.target)) {
                    chatSidebar.classList.add('translate-y-full');
                }
            });
        }
    });
    </script>
</body>
</html>
