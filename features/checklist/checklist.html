<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thư viện Checklist 🎀 - Zitthenkne</title>
  <link rel="icon" type="image/png" href="../../assets/logo.png">
  <meta name="theme-color" content="#FF8FB1">
  <script src="../../pwa-install.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="checklist.css">
</head>
<body class="min-h-screen text-gray-700 text-sm antialiased">

  <!-- Trang trí nền -->
  <div class="pointer-events-none fixed inset-0 z-0 overflow-hidden">
    <div class="absolute -top-24 -left-16 w-80 h-80 bg-pink-300/30 rounded-full blur-3xl float-slow"></div>
    <div class="absolute top-1/3 -right-20 w-96 h-96 bg-purple-300/25 rounded-full blur-3xl float-slower"></div>
    <i class="fas fa-heart absolute top-24 left-[12%] text-pink-200/70 text-2xl float-slow"></i>
    <i class="fas fa-star absolute bottom-24 left-[20%] text-pink-200/70 text-lg float-slower"></i>
  </div>

  <div class="relative z-10 max-w-5xl mx-auto p-4 sm:p-6">
    <!-- Header -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
      <div class="flex items-center gap-3">
        <a href="../../index.html" class="glass-card w-10 h-10 rounded-full flex items-center justify-center text-pink-500 hover:scale-105 transition" aria-label="Về trang chủ">
          <i class="fas fa-arrow-left"></i>
        </a>
        <div>
          <h1 class="text-xl sm:text-2xl font-bold text-gradient font-display tracking-tight">Thư viện Checklist</h1>
          <p class="text-xs text-gray-500 mt-0.5">Tạo và thực hiện checklist ATCS từng bước 🎀</p>
        </div>
      </div>
      <button id="btnCreateChecklist" class="btn-gradient hidden sm:inline-flex items-center gap-2 px-4 py-2.5 rounded-2xl font-semibold">
        <i class="fas fa-plus"></i> Tạo checklist
      </button>
    </div>

    <!-- Tìm kiếm -->
    <div class="relative mb-5">
      <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-pink-400"><i class="fas fa-magnifying-glass text-sm"></i></span>
      <input id="searchInput" type="search" placeholder="Tìm checklist..." autocomplete="off"
        class="glass-card w-full pl-10 pr-4 py-3 rounded-2xl text-base focus:outline-none focus:ring-4 focus:ring-pink-300/40 transition">
    </div>

    <!-- Danh sách -->
    <div id="cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

    <!-- Trạng thái rỗng -->
    <div id="emptyState" class="hidden glass-card rounded-3xl p-10 text-center fade-in">
      <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-tr from-pink-400 to-purple-400 flex items-center justify-center text-white text-3xl shadow-lg shadow-pink-300/40 mb-4">
        <i class="fas fa-list-check"></i>
      </div>
      <h3 class="font-bold text-gray-800 text-base font-display">Chưa có checklist nào</h3>
      <p class="text-xs text-gray-500 mt-1 mb-5">Bấm "Tạo checklist" để thêm checklist đầu tiên nha ✨</p>
      <button id="emptyCreateBtn" class="btn-gradient inline-flex items-center gap-2 px-5 py-2.5 rounded-2xl font-semibold">
        <i class="fas fa-plus"></i> Tạo checklist
      </button>
    </div>
  </div>

  <!-- FAB tạo checklist (mobile) -->
  <button id="fabCreate" aria-label="Tạo checklist"
    class="sm:hidden fixed right-5 z-40 w-14 h-14 rounded-full btn-gradient text-xl flex items-center justify-center"
    style="bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px))">
    <i class="fas fa-plus"></i>
  </button>

  <!-- Modal: Tạo / Sửa checklist (bottom-sheet trên mobile) -->
  <div id="modalChecklist" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-black/40 backdrop-blur-sm sm:p-4">
    <div class="glass-modal rounded-t-3xl sm:rounded-3xl w-full max-w-lg max-h-[88vh] overflow-y-auto p-5 sm:p-6 sheet-up safe-bottom">
      <div class="w-10 h-1.5 rounded-full bg-pink-200 mx-auto mb-3 sm:hidden"></div>
      <div class="flex items-center justify-between mb-4">
        <h3 id="modalTitle" class="text-lg font-bold text-gray-800 font-display">Tạo checklist</h3>
        <button id="closeChecklist" class="w-9 h-9 rounded-full bg-pink-50 text-pink-400 hover:bg-pink-100 transition" aria-label="Đóng"><i class="fas fa-xmark"></i></button>
      </div>

      <label class="block font-semibold text-gray-700 text-xs mb-1.5">Tên checklist</label>
      <input id="checklistName" type="text" placeholder="VD: Khám hô hấp" autocomplete="off"
        class="w-full px-4 py-3 rounded-2xl border-2 border-pink-100 bg-white/80 text-base focus:outline-none focus:ring-4 focus:ring-pink-300/40 focus:border-pink-300 transition">

      <div class="flex gap-2 mt-4 p-1 bg-pink-50/80 rounded-2xl">
        <button id="methodManual" class="method-tab flex-1 py-2 rounded-xl font-semibold text-gray-500 transition"><i class="fas fa-pen mr-1.5"></i>Nhập tay</button>
        <button id="methodCsv" class="method-tab flex-1 py-2 rounded-xl font-semibold text-gray-500 transition"><i class="fas fa-file-csv mr-1.5"></i>File CSV</button>
      </div>

      <div id="manualPane" class="mt-4 hidden">
        <div id="stepsContainer" class="space-y-2"></div>
        <button id="addStep" class="mt-3 w-full py-2.5 rounded-2xl border-2 border-dashed border-pink-200 text-pink-500 font-semibold hover:bg-pink-50 transition">
          <i class="fas fa-plus mr-1.5"></i>Thêm bước
        </button>
      </div>

      <div id="csvPane" class="mt-4 hidden">
        <p class="text-xs text-gray-500 leading-relaxed">Chọn file CSV (Excel xuất ra CSV) gồm 3 cột: <b>bước</b>, <b>nội dung</b>, <b>ghi chú</b> (ghi chú không bắt buộc).</p>
        <input id="csvFile" type="file" accept=".csv" class="mt-2 w-full text-xs file:mr-3 file:px-4 file:py-2 file:rounded-xl file:border-0 file:bg-pink-100 file:text-pink-600 file:font-semibold file:cursor-pointer">
        <p id="csvStatus" class="text-xs font-semibold text-pink-500 mt-2"></p>
      </div>

      <div class="flex justify-end gap-2 mt-5">
        <button id="cancelChecklist" class="px-4 py-2.5 rounded-2xl bg-gray-100 text-gray-600 font-semibold hover:bg-gray-200 transition">Hủy</button>
        <button id="saveChecklist" class="btn-gradient px-5 py-2.5 rounded-2xl font-semibold"><i class="fas fa-check mr-1.5"></i>Lưu checklist</button>
      </div>
    </div>
  </div>

  <script src="checklist.js"></script>
</body>
</html>
