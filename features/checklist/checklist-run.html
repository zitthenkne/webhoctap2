<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thực hiện Checklist 🏷️ - Zitthenkne Riso</title>
  <link rel="icon" type="image/png" href="../../assets/logo.png">
  <meta name="theme-color" content="#FAF7F2">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800;12..96,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="checklist.css">
  <style>
    .step-item.completed { background-color: #F0FDF4; border-color: #059669; }
    .step-item.completed .step-content { text-decoration: line-through; color: #71717A; }

    /* Thẻ quẹt chấm điểm */
    .grade-card { touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; will-change: transform; border: 3px solid #18181B; box-shadow: 6px 6px 0px #18181B; }
    .grade-card:active { cursor: grabbing; }
    .grade-card .stamp { position: absolute; top: 18px; font-size: 15px; font-weight: 900; padding: 6px 14px; border-radius: 8px; border: 3px dashed; opacity: 0; transform: rotate(-8deg); pointer-events: none; }
    .grade-card .stamp-pass { left: 16px; color: #059669; border-color: #059669; background-color: #ECFDF5; }
    .grade-card .stamp-fail { right: 16px; color: #DC2626; border-color: #DC2626; background-color: #FEF2F2; transform: rotate(8deg); }
  </style>
  <script src="../../pwa-install.js" defer></script>
</head>
<body class="min-h-screen text-stone-900 antialiased selection:bg-orange-200 selection:text-orange-950 pb-20 sm:pb-12">

  <div class="max-w-2xl mx-auto p-4 sm:p-6">
    <a href="checklist.html" class="btn-riso-secondary inline-flex items-center gap-2 px-4 py-2 text-xs sm:text-sm font-bold mb-4">
      <i class="fas fa-arrow-left"></i> Quay lại thư viện
    </a>

    <!-- Thẻ tổng quan quy trình -->
    <div class="riso-card p-5 sm:p-6 fade-in">
      <div class="flex items-center gap-2 mb-2">
        <span class="px-2 py-0.5 rounded bg-orange-100 border border-orange-300 text-orange-800 text-[10px] font-mono font-bold uppercase">CHECKLIST WORKSTATION</span>
      </div>
      <h1 id="title" class="text-xl sm:text-2xl font-black text-stone-900 font-display tracking-tight">Checklist</h1>
      <div id="meta" class="text-xs font-mono font-semibold text-stone-500 mt-1"></div>
      <div id="scoreChip" class="hidden mt-2 inline-flex items-center gap-1.5 px-3 py-1 rounded-lg bg-amber-50 border-2 border-amber-300 text-amber-800 text-xs font-bold font-mono"></div>
      
      <div class="mt-4">
        <div class="flex justify-between text-xs font-mono font-bold text-stone-600 mb-1.5">
          <span>TIẾN ĐỘ THỰC HIỆN</span><span id="progressText">0/0</span>
        </div>
        <div class="h-3 rounded-full bg-stone-200 border-2 border-stone-800 overflow-hidden">
          <div id="progressBar" class="h-full bg-orange-500 transition-all duration-300" style="width:0%"></div>
        </div>
      </div>

      <!-- Action Cluster -->
      <div class="max-sm:fixed max-sm:inset-x-3 max-sm:z-40 max-sm:bg-[#FFFDF9] max-sm:border-2 max-sm:border-stone-800 max-sm:rounded-2xl max-sm:p-2 max-sm:shadow-[3px_3px_0px_#18181B] sm:mt-5 flex gap-2"
        style="bottom: calc(.75rem + env(safe-area-inset-bottom, 0px))">
        <button id="startBtn" class="btn-riso-secondary flex-1 py-2.5 text-xs sm:text-sm font-bold"><i class="fas fa-book-open mr-1.5 text-blue-600"></i>Học</button>
        <button id="gradeBtn" class="btn-riso-primary flex-[1.3] py-2.5 text-xs sm:text-sm font-bold"><i class="fas fa-clipboard-check mr-1.5"></i>Kiểm tra</button>
        <button id="resetBtn" class="btn-riso-secondary w-12 py-2.5 text-xs sm:text-sm font-bold" title="Làm lại từ đầu"><i class="fas fa-rotate-right"></i></button>
      </div>
    </div>

    <!-- Danh sách bước -->
    <div id="steps" class="mt-5 space-y-2.5 pb-32 sm:pb-8"></div>
  </div>

  <!-- Chế độ học từng bước -->
  <div id="present" class="fixed inset-0 z-50 hidden items-center justify-center bg-stone-900/70 backdrop-blur-xs p-4">
    <div class="riso-modal-box w-full max-w-2xl p-6 sm:p-8 text-center">
      <div class="flex items-center justify-between mb-4">
        <span id="presentCounter" class="px-3 py-1 rounded-lg bg-stone-900 text-white text-xs font-mono font-bold">Bước 1/1</span>
        <button id="exitBtn" class="btn-icon-riso w-8 h-8 text-xs" aria-label="Thoát"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="h-2 rounded-full bg-stone-200 border border-stone-800 overflow-hidden mb-6">
        <div id="presentBar" class="h-full bg-orange-500 transition-all duration-300" style="width:0%"></div>
      </div>
      <div id="presentInner" class="min-h-[120px] py-4">
        <div id="presentTitle" class="text-xs font-bold text-orange-600 uppercase font-mono tracking-wider"></div>
        <div id="presentContent" class="text-lg sm:text-2xl font-extrabold text-stone-900 mt-2 font-display leading-snug"></div>
        <div id="presentNote" class="text-xs sm:text-sm text-stone-600 mt-3 font-medium bg-amber-50 p-2.5 rounded-xl border border-amber-200 inline-block"></div>
      </div>
      <div class="flex gap-2.5 justify-center mt-6">
        <button id="prevBtn" class="btn-riso-secondary px-5 py-2.5 text-xs sm:text-sm font-bold"><i class="fas fa-arrow-left mr-1.5"></i>Quay lại</button>
        <button id="nextBtn" class="btn-riso-primary px-6 py-2.5 text-xs sm:text-sm font-bold">Xong, tiếp <i class="fas fa-arrow-right ml-1.5"></i></button>
      </div>
      <div class="text-[11px] text-stone-400 mt-4 font-mono hidden sm:block">Space / → : xong &amp; tiếp · ← : quay lại · Esc : thoát</div>
    </div>
  </div>

  <!-- Chế độ kiểm tra chấm điểm -->
  <div id="grade" class="fixed inset-0 z-50 hidden items-center justify-center bg-stone-900/70 backdrop-blur-xs p-4">
    <div class="w-full max-w-md">
      <!-- Màn quẹt thẻ -->
      <div id="gradeRun">
        <div class="flex items-center justify-between mb-3">
          <span id="gradeCounter" class="px-3 py-1 rounded-lg bg-stone-900 text-white text-xs font-mono font-bold">1/1</span>
          <div class="flex gap-2">
            <button id="gradeUndo" class="px-3 py-1 rounded-lg bg-stone-800 text-white text-xs font-bold hover:bg-stone-700 transition"><i class="fas fa-rotate-left mr-1"></i>Hoàn tác</button>
            <button id="gradeExit" class="w-8 h-8 rounded-lg bg-stone-800 text-white hover:bg-stone-700 transition flex items-center justify-center text-xs" aria-label="Thoát"><i class="fas fa-xmark"></i></button>
          </div>
        </div>
        <div class="h-2 rounded-full bg-stone-700 overflow-hidden mb-4 border border-stone-600">
          <div id="gradeBar" class="h-full bg-orange-500 transition-all duration-300" style="width:0%"></div>
        </div>
        <div id="gradeStack" class="relative h-[46vh] min-h-[280px] sm:h-[340px]"></div>
        <div class="flex justify-center gap-3 mt-5">
          <button id="gradeFail" class="flex-1 max-w-[180px] py-3 rounded-2xl bg-red-600 text-white font-bold border-2 border-stone-900 shadow-[3px_3px_0px_#18181B] active:translate-x-0.5 active:translate-y-0.5 transition"><i class="fas fa-xmark mr-1.5"></i>Chưa thuộc</button>
          <button id="gradePass" class="flex-1 max-w-[180px] py-3 rounded-2xl bg-emerald-600 text-white font-bold border-2 border-stone-900 shadow-[3px_3px_0px_#18181B] active:translate-x-0.5 active:translate-y-0.5 transition"><i class="fas fa-check mr-1.5"></i>Thuộc / Đúng</button>
        </div>
        <div class="text-center text-[11px] text-stone-300 font-mono mt-3 safe-bottom">Quẹt phải = thuộc · quẹt trái = chưa · (phím → / ←)</div>
      </div>

      <!-- Màn kết quả -->
      <div id="gradeResult" class="hidden riso-modal-box p-6 sm:p-8 text-center max-h-[85vh] overflow-y-auto">
        <div id="resultEmoji" class="text-5xl mb-3">🌟</div>
        <div id="resultPct" class="text-4xl font-black text-orange-600 font-display">100%</div>
        <div id="resultDetail" class="text-xs font-mono font-bold text-stone-500 mt-1"></div>
        <div id="resultMsg" class="font-bold text-stone-800 mt-2"></div>
        <div id="resultFailed" class="mt-4 text-left"></div>
        <div class="flex flex-col gap-2 mt-5">
          <button id="retryFailedBtn" class="btn-riso-primary py-2.5 text-xs font-bold hidden"><i class="fas fa-repeat mr-1.5"></i>Ôn lại bước chưa thuộc</button>
          <button id="retryAllBtn" class="btn-riso-secondary py-2.5 text-xs font-bold"><i class="fas fa-rotate-right mr-1.5"></i>Kiểm tra lại từ đầu</button>
          <button id="resultCloseBtn" class="btn-riso-secondary py-2.5 text-xs font-bold bg-stone-100">Đóng</button>
        </div>
      </div>
    </div>
  </div>

  <script src="checklist-run.js"></script>
</body>
</html>
