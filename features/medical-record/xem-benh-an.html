<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Xem bệnh án</title>
    <link rel="icon" type="image/png" href="../../assets/logo.png">
    <script src="../../pwa-install.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', 'Roboto', Arial, sans-serif; }
        ::-webkit-scrollbar { width: 8px; background: #ffe4ef; }
        ::-webkit-scrollbar-thumb { background: #f472b6; border-radius: 8px; }

        .fade-in { animation: fadeIn .4s ease-out both; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

        /* Mục lục nhảy nhanh */
        .toc-link {
            display: block; padding: 6px 10px; border-radius: 8px; font-size: 13px;
            color: #6b7280; border-left: 3px solid transparent; transition: all .15s;
        }
        .toc-link:hover { background: #fdf2f8; color: #db2777; }
        .toc-link.active { background: #fdf2f8; color: #db2777; border-left-color: #ec4899; font-weight: 600; }

        .rec-section { scroll-margin-top: 90px; }
        /* Mục Hành chính: xếp cột cho gọn, tự xuống 1 cột trên điện thoại */
        .sec-grid { display: grid; gap: 4px 24px; }
        @media (min-width: 640px) { .sec-grid { grid-template-columns: 1fr 1fr; } }

        /* Thanh công cụ nổi trên điện thoại */
        .mobile-bar { padding-bottom: calc(0.5rem + env(safe-area-inset-bottom)); }

        /* ============ IN / XUẤT PDF: khổ A4, chỉ giữ nội dung ============ */
        @media print {
            @page { size: A4; margin: 16mm 14mm; }
            .no-print, header, footer, .mobile-bar, aside { display: none !important; }
            html, body { background: #fff !important; }
            main { box-shadow: none !important; border: none !important; max-width: 100% !important; padding: 0 !important; margin: 0 !important; border-radius: 0 !important; }
            .rec-section {
                background: #fff !important; border: none !important; box-shadow: none !important;
                padding: 0 !important; margin: 0 0 10pt 0 !important; break-inside: avoid;
            }
            .rec-section h3 {
                color: #000 !important; font-size: 11.5pt !important; border-bottom: 1px solid #000;
                padding-bottom: 2pt; margin-bottom: 4pt !important;
            }
            .rec-section i { display: none !important; }
            .print-head { display: block !important; }
            .print-sign { display: block !important; break-inside: avoid; }
            .field-label { color: #000 !important; }
            .field-value { color: #000 !important; }
            .vital-chip { border: 1px solid #666 !important; background: #fff !important; }
            .sec-grid { grid-template-columns: 1fr 1fr; }
            body { font-size: 11pt; color: #000; line-height: 1.45; }
        }
        .print-head, .print-sign { display: none; }

        /* ====== Phiếu cận lâm sàng ====== */
        .cls-card {
            background: #fff; border: 1px solid #fbcfe8; border-radius: 14px;
            padding: 12px 14px; margin-bottom: 12px;
        }
        .cls-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; margin-bottom: 8px; }
        .cls-title { font-weight: 800; color: #be185d; }
        .cls-group { font-size: 11px; font-weight: 700; color: #7c3aed; background: #f5f3ff; border-radius: 9999px; padding: 2px 9px; }
        .cls-date { font-size: 12px; color: #9ca3af; margin-left: auto; }
        .cls-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .cls-table th {
            text-align: left; font-size: 10px; text-transform: uppercase; color: #9ca3af;
            font-weight: 700; padding: 2px 6px; border-bottom: 1px solid #fce7f3;
        }
        .cls-table td { padding: 4px 6px; border-bottom: 1px solid #fdf2f8; }
        .cls-table .cls-v { white-space: nowrap; }
        .cls-table .cls-u, .cls-table .cls-r { color: #9ca3af; font-size: 12px; white-space: nowrap; }
        .cls-abn .cls-v b, .cls-flag { font-weight: 800; }
        tr.cls-abn.is-high .cls-v b, tr.cls-abn.is-high .cls-flag { color: #dc2626; }
        tr.cls-abn.is-low .cls-v b, tr.cls-abn.is-low .cls-flag { color: #2563eb; }
        tr.cls-abn.is-high { background: #fff7f7; }
        tr.cls-abn.is-low { background: #f7faff; }
        .cls-note { margin-top: 8px; font-size: 13px; color: #374151; white-space: pre-line; }
        .cls-imgs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .cls-fig { margin: 0; width: 160px; }
        .cls-img {
            width: 160px; height: 120px; object-fit: cover; border-radius: 10px;
            border: 1px solid #fbcfe8; cursor: zoom-in; display: block;
        }
        .cls-fig figcaption { font-size: 11px; color: #6b7280; margin-top: 3px; text-align: center; }

        /* Xem ảnh phóng to */
        .lightbox {
            position: fixed; inset: 0; z-index: 70; background: #000000e6;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px;
        }
        .lightbox.hidden { display: none; }
        .lightbox img { max-width: 100%; max-height: 85vh; object-fit: contain; border-radius: 8px; }
        .lightbox-cap { color: #fff; font-size: 13px; text-align: center; }
        .lightbox-x {
            position: absolute; top: 14px; right: 16px; background: #ffffff22; color: #fff;
            border: 0; border-radius: 9999px; width: 40px; height: 40px; font-size: 18px; cursor: pointer;
        }

        @media print {
            .cls-card { border: 1px solid #999 !important; background: #fff !important; break-inside: avoid; padding: 6pt 8pt !important; }
            .cls-title { color: #000 !important; }
            .cls-group { display: none; }
            .cls-table th, .cls-table td { border-bottom: 1px solid #ccc !important; }
            .cls-abn .cls-v b { color: #000 !important; text-decoration: underline; }
            tr.cls-abn { background: #f2f2f2 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .cls-fig { width: 46%; }
            .cls-img { width: 100%; height: auto; max-height: 80mm; object-fit: contain; break-inside: avoid; }
            .lightbox { display: none !important; }
        }
    </style>
</head>
<body class="min-h-screen bg-[#fdf7fa]">

<!-- ================= Thanh trên ================= -->
<header class="no-print sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-pink-100 shadow-sm">
    <div class="max-w-6xl mx-auto flex items-center gap-2 sm:gap-3 px-3 sm:px-6 py-2.5">
        <a href="../study-room/waiting-room.html" class="w-10 h-10 rounded-xl border border-pink-200 text-pink-500 hover:bg-pink-50 flex items-center justify-center transition flex-shrink-0" title="Danh sách bệnh án"><i class="fas fa-arrow-left"></i></a>
        <div class="min-w-0 flex-1">
            <h1 id="head-name" class="font-extrabold text-gray-800 truncate text-base sm:text-lg leading-tight">Xem bệnh án</h1>
            <p id="head-meta" class="text-xs text-gray-400 truncate"></p>
        </div>
        <div class="hidden sm:flex items-center gap-2">
            <a id="edit-record-btn" href="#" class="hidden px-3 py-2 border border-pink-200 text-pink-500 rounded-xl hover:bg-pink-50 transition text-sm font-semibold"><i class="fas fa-pen mr-1"></i>Sửa</a>
            <button id="copy-btn" class="px-3 py-2 border border-pink-200 text-pink-500 rounded-xl hover:bg-pink-50 transition text-sm font-semibold"><i class="fas fa-copy mr-1"></i>Sao chép</button>
            <button id="txt-btn" class="px-3 py-2 border border-pink-200 text-pink-500 rounded-xl hover:bg-pink-50 transition text-sm font-semibold" title="Bản Markdown — mở bằng Google Docs là có sẵn heading"><i class="fas fa-file-lines mr-1"></i>Tải .md</button>
            <button id="word-btn" class="px-3 py-2 border border-pink-200 text-pink-500 rounded-xl hover:bg-pink-50 transition text-sm font-semibold"><i class="fas fa-file-word mr-1"></i>Tải .doc</button>
            <button id="share-btn" class="hidden px-3 py-2 border border-pink-200 text-pink-500 rounded-xl hover:bg-pink-50 transition text-sm font-semibold"><i class="fas fa-share-nodes mr-1"></i>Chia sẻ</button>
            <button id="print-btn" class="px-4 py-2 bg-pink-500 text-white rounded-xl hover:bg-pink-600 active:scale-95 transition text-sm font-bold shadow-lg shadow-pink-200"><i class="fas fa-print mr-1"></i>In / PDF</button>
        </div>
        <button id="mobile-more" class="sm:hidden w-10 h-10 rounded-xl bg-pink-500 text-white flex items-center justify-center flex-shrink-0"><i class="fas fa-ellipsis-v"></i></button>
    </div>
</header>

<div class="max-w-6xl mx-auto flex gap-6 px-2 sm:px-6 py-4 sm:py-6">
    <!-- Mục lục -->
    <aside id="toc" class="no-print hidden lg:block w-52 flex-shrink-0">
        <div class="sticky top-20 bg-white/80 backdrop-blur rounded-2xl border border-pink-100 p-3 shadow-sm">
            <p class="text-[11px] font-bold text-gray-400 uppercase tracking-wide px-2 mb-2">Mục lục</p>
            <nav id="toc-nav" class="space-y-0.5"></nav>
        </div>
    </aside>

    <main class="bg-white rounded-3xl shadow-xl p-4 sm:p-8 flex-1 min-w-0 border border-pink-100 fade-in">
        <!-- Tiêu đề chỉ hiện khi in -->
        <div class="print-head" style="text-align:center;margin-bottom:14pt">
            <div style="font-weight:700;font-size:13pt;text-transform:uppercase">Bệnh án nội khoa</div>
            <div id="print-sub" style="font-size:10pt;margin-top:3pt"></div>
        </div>
        <div id="medical-record-view" class="space-y-4 text-[15px] sm:text-base"></div>
        <div class="print-sign" style="margin-top:20pt;text-align:right">
            <div id="sign-date" style="font-style:italic"></div>
            <div style="font-weight:700;margin-top:4pt">Người làm bệnh án</div>
            <div style="font-size:9pt;font-style:italic">(Ký, ghi rõ họ tên)</div>
            <div id="sign-name" style="margin-top:40pt;font-weight:600"></div>
        </div>
    </main>
</div>

<footer class="no-print text-center text-pink-300 text-xs py-6">© 2025 Zitthenkne · Bệnh án điện tử</footer>

<!-- Thanh công cụ điện thoại -->
<div id="mobile-actions" class="mobile-bar no-print sm:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur border-t border-pink-100 px-2 pt-2 translate-y-full transition-transform duration-200">
    <div class="grid grid-cols-5 gap-1.5">
        <button data-act="edit" class="flex flex-col items-center gap-1 py-2 rounded-xl hover:bg-pink-50 text-pink-500 text-[11px] font-semibold"><i class="fas fa-pen text-base"></i>Sửa</button>
        <button data-act="copy" class="flex flex-col items-center gap-1 py-2 rounded-xl hover:bg-pink-50 text-pink-500 text-[11px] font-semibold"><i class="fas fa-copy text-base"></i>Sao chép</button>
        <button data-act="txt" class="flex flex-col items-center gap-1 py-2 rounded-xl hover:bg-pink-50 text-pink-500 text-[11px] font-semibold"><i class="fas fa-file-lines text-base"></i>Tải .md</button>
        <button data-act="word" class="flex flex-col items-center gap-1 py-2 rounded-xl hover:bg-pink-50 text-pink-500 text-[11px] font-semibold"><i class="fas fa-file-word text-base"></i>Tải .doc</button>
        <button data-act="print" class="flex flex-col items-center gap-1 py-2 rounded-xl bg-pink-500 text-white text-[11px] font-semibold"><i class="fas fa-print text-base"></i>In / PDF</button>
    </div>
</div>

<!-- Mục lục dạng thẻ trượt cho điện thoại -->
<button id="toc-fab" class="no-print lg:hidden fixed left-4 bottom-5 z-40 w-12 h-12 rounded-full bg-white border border-pink-200 text-pink-500 shadow-lg flex items-center justify-center" style="bottom:calc(1.25rem + env(safe-area-inset-bottom))" title="Mục lục"><i class="fas fa-list-ul"></i></button>
<div id="toc-sheet" class="no-print lg:hidden fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/40" data-close></div>
    <div id="toc-panel" class="absolute bottom-0 inset-x-0 bg-white rounded-t-3xl shadow-2xl max-h-[72vh] overflow-y-auto p-4 translate-y-full transition-transform duration-200" style="padding-bottom:calc(1.5rem + env(safe-area-inset-bottom))">
        <div class="w-10 h-1.5 bg-gray-200 rounded-full mx-auto mb-3"></div>
        <p class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-2 px-1">Mục lục</p>
        <nav id="toc-nav-mobile" class="space-y-0.5"></nav>
    </div>
</div>

<div id="toast-container" class="fixed bottom-24 sm:bottom-6 right-4 z-50 flex flex-col items-end space-y-2 pointer-events-none"></div>

<script type="module" src="xem-benh-an.js"></script>
</body>
</html>
