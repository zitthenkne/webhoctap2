<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#fce6ef">
    <title>Xem bệnh án</title>
    <link rel="icon" type="image/png" href="../../assets/logo.png">
    <script src="../../pwa-install.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Giao diện "sổ dán" (giấy, băng keo washi, kẹp ghim) — toàn bộ ở file riêng -->
    <link rel="stylesheet" href="xem-benh-an.css?v=2">
</head>
<body class="xb-body">

<!-- ================================ THANH TRÊN ================================ -->
<header class="xb-top no-print">
    <div class="xb-top-in">
        <a href="../study-room/waiting-room.html" class="xb-ib" title="Danh sách bệnh án"><i class="fas fa-arrow-left"></i></a>
        <div class="xb-title">
            <h1 id="head-name">Xem bệnh án</h1>
            <p id="head-meta"></p>
        </div>

        <div class="xb-tools">
            <button id="search-btn" class="xb-ib" title="Tìm trong bệnh án (Ctrl+F)"><i class="fas fa-magnifying-glass"></i></button>
            <button id="present-btn" class="xb-btn" title="Trình bệnh từng mục một, chữ to, vuốt để chuyển"><i class="fas fa-chalkboard-user"></i>Trình bệnh</button>
            <button id="print-btn" class="xb-btn"><i class="fas fa-print"></i>In / PDF</button>
            <button class="xb-btn" data-sheet="more" title="Xuất file & tùy chọn hiển thị"><i class="fas fa-ellipsis"></i>Thêm</button>
            <a id="edit-record-btn" href="#" class="xb-btn xb-primary" hidden><i class="fas fa-pen"></i>Sửa bệnh án</a>
        </div>

        <!-- Sửa là việc hay làm nhất -> trên điện thoại luôn có nút riêng ở thanh trên,
             ngoài nút giữa dock, khỏi phải mở thẻ trượt mới tìm thấy. -->
        <a id="edit-top-mobile" href="#" class="xb-edit-pill xb-only-mobile" title="Sửa bệnh án" hidden><i class="fas fa-pen"></i>Sửa</a>
    </div>

    <div id="search-bar" class="xb-search">
        <div class="xb-search-in">
            <i class="fas fa-magnifying-glass"></i>
            <input id="search-input" type="search" placeholder="Tìm trong bệnh án… (gõ không dấu cũng ra)" autocomplete="off">
            <span id="search-count"></span>
            <button id="search-prev" title="Kết quả trước"><i class="fas fa-chevron-up"></i></button>
            <button id="search-next" title="Kết quả sau"><i class="fas fa-chevron-down"></i></button>
            <button id="search-close" title="Đóng"><i class="fas fa-xmark"></i></button>
        </div>
    </div>

    <div class="xb-read"><span id="read-bar"></span></div>
</header>

<div class="xb-wrap">
    <!-- Mục lục cột bên (màn rộng) -->
    <aside class="xb-toc no-print">
        <div class="xb-toc-box">
            <p class="xb-toc-cap">Mục lục</p>
            <nav id="toc-nav"></nav>
        </div>
    </aside>

    <main class="xb-main fade-in">
        <!-- Tiêu đề chỉ hiện khi in -->
        <div class="print-head" style="text-align:center;margin-bottom:14pt">
            <div style="font-weight:700;font-size:13pt;text-transform:uppercase">Bệnh án</div>
            <div id="print-sub" style="font-size:10pt;margin-top:3pt"></div>
        </div>

        <div id="snapshot" class="no-print"></div>
        <div id="medical-record-view"></div>

        <div class="print-sign" style="margin-top:20pt;text-align:right">
            <div id="sign-date" style="font-style:italic"></div>
            <div style="font-weight:700;margin-top:4pt">Người làm bệnh án</div>
            <div style="font-size:9pt;font-style:italic">(Ký, ghi rõ họ tên)</div>
            <div id="sign-name" style="margin-top:40pt;font-weight:600"></div>
        </div>
    </main>
</div>

<footer class="xb-foot no-print">© 2025 Zitthenkne · Bệnh án điện tử</footer>

<!-- ================================ DOCK ĐIỆN THOẠI ================================ -->
<nav class="xb-dock no-print" id="dock">
    <button data-sheet="toc"><i class="fas fa-list-ul"></i>Mục lục</button>
    <button data-act="search"><i class="fas fa-magnifying-glass"></i>Tìm</button>
    <button class="xb-dock-main" data-act="edit"><i class="fas fa-pen"></i>Sửa</button>
    <button data-act="present"><i class="fas fa-chalkboard-user"></i>Trình bệnh</button>
    <button data-sheet="more"><i class="fas fa-ellipsis"></i>Thêm</button>
</nav>

<!-- ================================ THẺ TRƯỢT ================================ -->
<div class="xb-sheet no-print" id="sheet-toc" hidden>
    <div class="xb-sheet-mask" data-close></div>
    <div class="xb-sheet-panel">
        <div class="xb-grab"></div>
        <p class="xb-sheet-title">Mục lục bệnh án</p>
        <nav id="toc-nav-mobile"></nav>
    </div>
</div>

<div class="xb-sheet no-print" id="sheet-more" hidden>
    <div class="xb-sheet-mask" data-close></div>
    <div class="xb-sheet-panel">
        <div class="xb-grab"></div>
        <div class="xb-menu" style="margin-bottom:14px">
            <a id="edit-link-mobile" href="#" class="xb-menu-main" hidden><i class="fas fa-pen"></i><span>Sửa bệnh án<small>Mở lại trang nhập liệu</small></span></a>
        </div>
        <p class="xb-sheet-title">Xuất bệnh án</p>
        <div class="xb-menu" style="margin-bottom:16px">
            <button data-act="copy"><i class="fas fa-copy"></i><span>Sao chép<small>Dán thẳng vào Google Docs / Word, giữ nguyên định dạng</small></span></button>
            <button data-act="print"><i class="fas fa-print"></i><span>In / Lưu PDF<small>Khổ A4, có sẵn khối ký tên</small></span></button>
            <button data-act="word"><i class="fas fa-file-word"></i><span>Tải file .doc<small>Mở bằng Word</small></span></button>
            <button data-act="txt"><i class="fas fa-file-lines"></i><span>Tải file .md<small>Kéo vào Drive là ra heading sẵn</small></span></button>
            <button data-act="vanxuoi"><i class="fas fa-align-left"></i><span>Chép bản văn xuôi<small>Đoạn văn học thuật, không dấu chấm phẩy và dấu hai chấm</small></span></button>
            <button data-act="vanxuoitrinh"><i class="fas fa-chalkboard-user"></i><span>Tải bản trình bệnh<small>Bản rút gọn để đọc trước hội đồng</small></span></button>
            <button data-act="share" id="share-btn" hidden><i class="fas fa-share-nodes"></i><span>Chia sẻ<small>Gửi qua Zalo, Messenger…</small></span></button>
        </div>
        <p class="xb-sheet-title">Hiển thị</p>
        <div class="xb-row">
            <span class="lbl">Cỡ chữ</span>
            <span class="xb-step">
                <button id="fs-down" title="Nhỏ lại">A−</button>
                <span id="fs-val">100%</span>
                <button id="fs-up" title="To lên">A+</button>
            </span>
        </div>
        <div class="xb-row">
            <span class="lbl">Chế độ riêng tư<small style="display:block;font-weight:400;font-size:11.5px;color:var(--muted)">Che tên, địa chỉ, số điện thoại — che cả khi in</small></span>
            <button id="private-switch" class="xb-switch" role="switch" aria-checked="false"></button>
        </div>
        <div class="xb-row">
            <span class="lbl">Thu gọn tất cả mục</span>
            <button id="fold-switch" class="xb-switch" role="switch" aria-checked="false"></button>
        </div>
    </div>
</div>

<!-- ================================ TRÌNH BỆNH ================================ -->
<div id="present" class="no-print" hidden>
    <div class="pr-top">
        <span class="who" id="pr-who"></span>
        <span class="pr-count" id="pr-count"></span>
        <button class="xb-ib" id="pr-exit" title="Thoát (Esc)"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="pr-body" id="pr-body"></div>
    <div class="pr-nav">
        <button id="pr-prev" title="Mục trước"><i class="fas fa-chevron-left"></i></button>
        <div class="pr-dots" id="pr-dots"></div>
        <button id="pr-next" title="Mục sau"><i class="fas fa-chevron-right"></i></button>
    </div>
</div>

<!-- ================================ XEM ẢNH TO ================================ -->
<div id="lightbox" class="lightbox no-print" hidden>
    <button class="lightbox-x" aria-label="Đóng"><i class="fas fa-xmark"></i></button>
    <img alt="Ảnh cận lâm sàng">
    <p class="lightbox-cap"></p>
</div>

<div id="toast-container" class="fixed bottom-28 sm:bottom-6 right-4 z-[90] flex flex-col items-end space-y-2 pointer-events-none"></div>

<script type="module" src="xem-benh-an.js"></script>
  <!-- Bắt buộc đăng nhập: khách sẽ thấy lớp chặn thay vì làm rồi mất dữ liệu -->
  <script type="module">
    import { guardPage } from '../../core/require-login.js';
    guardPage('Xem bệnh án');
  </script>
</body>
</html>
