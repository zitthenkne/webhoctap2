<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffe9f3">
    <title>Xem bệnh án</title>
    <link rel="icon" type="image/png" href="../../assets/logo.png">
    <script src="../../pwa-install.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* =====================================================================
           GIAO DIỆN "KẸO NGỌT" — hường phấn làm chủ đạo, điểm thêm mint /
           lavender / đào / trời / chanh cho từng mục cho đỡ ngán.
           Lưu ý (bẫy đã gặp ở các trang khác):
           - Tailwind CDN chèn <style> SAU khối này -> ghi đè utility phải có
             tag hoặc #id đi kèm cho đủ độ ưu tiên.
           - backdrop-filter / transform biến thẻ cha thành gốc neo của
             position:fixed -> mọi thứ fixed (dock, sheet, present, lightbox)
             đều là con trực tiếp của <body>.
           ===================================================================== */
        :root {
            --pink-50:#fff5fa; --pink-100:#ffe9f3; --pink-200:#ffd4e7; --pink-300:#ffb6d5;
            --pink-400:#fb92c1; --pink-500:#f2669f; --pink-600:#dd4285; --pink-ink:#9c2f5e;
            --ink:#4b3a43; --ink-soft:#8a7681; --muted:#ad98a3;
            --line:#ffe0ee;
            --sh-s:0 2px 10px rgba(236,72,153,.07);
            --sh-m:0 14px 34px -14px rgba(236,72,153,.32);
            --r-xl:26px; --r-lg:20px; --r-md:14px;
            --fs:15.5px;              /* cỡ chữ nội dung, đổi bằng nút A- / A+ */
            --dock-h:74px;
        }
        /* Bảng màu pastel gán cho từng mục (xoay vòng, hường vẫn nhiều nhất) */
        [data-accent="pink"]     { --ac-bg:#fff2f8; --ac-line:#ffd4e7; --ac-ink:#dd4285; --ac-chip:#ffe1ef; }
        [data-accent="mint"]     { --ac-bg:#f0fbf7; --ac-line:#c8ecdf; --ac-ink:#189178; --ac-chip:#dcf5ec; }
        [data-accent="lavender"] { --ac-bg:#f6f2ff; --ac-line:#ddd2fb; --ac-ink:#7255cf; --ac-chip:#e9e1ff; }
        [data-accent="peach"]    { --ac-bg:#fff6ee; --ac-line:#ffdcbe; --ac-ink:#d2762f; --ac-chip:#ffe9d6; }
        [data-accent="sky"]      { --ac-bg:#f1f8ff; --ac-line:#c9e2fb; --ac-ink:#2f7fc6; --ac-chip:#dcedfd; }
        [data-accent="lemon"]    { --ac-bg:#fffaea; --ac-line:#ffe9a8; --ac-ink:#a5811c; --ac-chip:#fff2c9; }

        * { -webkit-tap-highlight-color: transparent; }
        /* Bẫy: class của trang (display:grid/flex) đè mất display:none mặc định của
           thuộc tính [hidden] -> ép một lần cho cả trang, khỏi phải nhớ từng chỗ. */
        [hidden] { display: none !important; }
        body.xb-body {
            margin: 0; min-height: 100vh; color: var(--ink);
            font-family: 'Be Vietnam Pro', 'Segoe UI', 'Roboto', Arial, sans-serif;
            background: linear-gradient(180deg, #fff8fc 0%, #fdf1f8 42%, #f8f3ff 100%);
            background-attachment: fixed;
            padding-bottom: calc(var(--dock-h) + env(safe-area-inset-bottom) + 12px);
        }
        h1, h2, h3, .xb-display { font-family: 'Quicksand', 'Be Vietnam Pro', sans-serif; }

        ::-webkit-scrollbar { width: 9px; background: var(--pink-100); }
        ::-webkit-scrollbar-thumb { background: var(--pink-300); border-radius: 9px; }
        ::selection { background: var(--pink-200); }

        /* Vệt màu mờ ở nền cho đỡ phẳng */
        .xb-bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
        .xb-bg span { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; }
        .xb-bg .b1 { width: 340px; height: 340px; background: #ffd0e6; top: -110px; left: -80px; }
        .xb-bg .b2 { width: 300px; height: 300px; background: #dff4ec; top: 32%; right: -110px; }
        .xb-bg .b3 { width: 320px; height: 320px; background: #e6dcff; bottom: -120px; left: 18%; }

        .fade-in { animation: fadeIn .45s cubic-bezier(.2,.8,.3,1) both; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

        /* ============================ THANH TRÊN ============================ */
        header.xb-top {
            position: sticky; top: 0; z-index: 40;
            background: rgba(255,252,253,.88); backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
        }
        .xb-top-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
        @media (min-width: 640px) { .xb-top-in { padding: 10px 20px; } }
        .xb-title { min-width: 0; flex: 1; }
        .xb-title h1 { margin: 0; font-size: 17px; font-weight: 700; color: var(--pink-ink); line-height: 1.25;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .xb-title p { margin: 1px 0 0; font-size: 11.5px; color: var(--muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .xb-ib {
            width: 42px; height: 42px; flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
            border-radius: 14px; border: 1px solid var(--pink-200); background: #fff; color: var(--pink-500);
            cursor: pointer; transition: .16s; font-size: 15px; text-decoration: none;
        }
        .xb-ib:hover { background: var(--pink-50); border-color: var(--pink-300); }
        .xb-ib:active { transform: scale(.94); }
        .xb-ib.is-on { background: var(--pink-500); border-color: var(--pink-500); color: #fff; }

        .xb-tools { display: none; align-items: center; gap: 8px; }
        @media (min-width: 960px) { .xb-tools { display: flex; } .xb-only-mobile { display: none !important; } }
        /* Nút Sửa ở thanh trên (điện thoại): có CHỮ chứ không chỉ mỗi icon */
        a.xb-edit-pill {
            flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; height: 42px; padding: 0 15px;
            border-radius: 14px; text-decoration: none; color: #fff; white-space: nowrap;
            background: linear-gradient(135deg, #fb92c1, #ef5b9c);
            font: 700 13.5px 'Be Vietnam Pro', sans-serif; box-shadow: 0 8px 18px -8px rgba(236,72,153,.8);
        }
        a.xb-edit-pill:active { transform: scale(.95); }
        .xb-btn {
            display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 14px;
            border: 1px solid var(--pink-200); background: #fff; color: var(--pink-500);
            font: 600 13.5px 'Be Vietnam Pro', sans-serif; cursor: pointer; transition: .16s; text-decoration: none; white-space: nowrap;
        }
        .xb-btn:hover { background: var(--pink-50); border-color: var(--pink-300); }
        .xb-btn:active { transform: scale(.96); }
        .xb-btn.xb-primary {
            background: linear-gradient(135deg, #fb92c1, #ef5b9c); border-color: transparent; color: #fff;
            box-shadow: 0 8px 20px -8px rgba(236,72,153,.7);
        }
        .xb-btn.xb-primary:hover { filter: brightness(1.05); }

        /* Thanh tìm kiếm trong bệnh án */
        .xb-search { display: none; max-width: 1240px; margin: 0 auto; padding: 0 14px 10px; }
        .xb-search.is-open { display: block; }
        .xb-search-in {
            display: flex; align-items: center; gap: 6px; background: #fff;
            border: 1px solid var(--pink-200); border-radius: 16px; padding: 5px 6px 5px 12px;
            box-shadow: var(--sh-s);
        }
        .xb-search-in > i { color: var(--pink-400); font-size: 13px; }
        #search-input {
            flex: 1; min-width: 0; border: 0; outline: none; background: transparent; padding: 7px 4px;
            font: 500 15px 'Be Vietnam Pro', sans-serif; color: var(--ink);
        }
        #search-count { font: 700 12px 'Be Vietnam Pro', sans-serif; color: var(--muted); white-space: nowrap; padding: 0 4px; }
        .xb-search-in button {
            width: 32px; height: 32px; border: 0; border-radius: 10px; background: var(--pink-50);
            color: var(--pink-500); cursor: pointer; font-size: 12px;
        }
        .xb-search-in button:hover { background: var(--pink-100); }
        mark.xb-hit { background: #ffe9a8; color: #7a5c00; border-radius: 4px; padding: 0 1px; }
        mark.xb-hit.is-cur { background: var(--pink-300); color: #fff; box-shadow: 0 0 0 3px var(--pink-100); }

        /* Vạch tiến độ đọc */
        .xb-read { height: 3px; background: transparent; }
        .xb-read span { display: block; height: 100%; width: 0;
            background: linear-gradient(90deg, #ffc2dd, #f2669f, #c9a7ff); border-radius: 0 3px 3px 0; transition: width .12s linear; }

        /* ============================ BỐ CỤC ============================ */
        /* Điện thoại: chừa mép rộng cho đỡ ngộp, các khối cách nhau hẳn ra */
        .xb-wrap { max-width: 1240px; margin: 0 auto; display: flex; gap: 22px; padding: 16px 16px 24px; }
        @media (min-width: 640px) { .xb-wrap { padding: 22px 22px 30px; } }
        aside.xb-toc { display: none; width: 214px; flex: 0 0 auto; }
        @media (min-width: 1180px) { aside.xb-toc { display: block; } }
        .xb-toc-box {
            position: sticky; top: 84px; background: rgba(255,255,255,.82); border: 1px solid var(--line);
            border-radius: var(--r-lg); padding: 12px 10px; box-shadow: var(--sh-s);
        }
        .xb-toc-cap { font: 700 10.5px 'Be Vietnam Pro', sans-serif; letter-spacing: .08em; text-transform: uppercase;
            color: var(--muted); padding: 0 8px 8px; margin: 0; }
        .toc-link {
            display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; font-size: 13px;
            color: var(--ink-soft); text-decoration: none; transition: .15s; line-height: 1.3;
        }
        .toc-link:hover { background: var(--pink-50); color: var(--pink-600); }
        .toc-link.active { background: linear-gradient(135deg, #ffe9f3, #fdf0ff); color: var(--pink-600); font-weight: 700;
            box-shadow: inset 3px 0 0 var(--pink-400); }
        .toc-link .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pink-200); flex: 0 0 auto; }
        .toc-link.active .dot { background: var(--pink-500); }

        main.xb-main { flex: 1; min-width: 0; }

        /* ====================== THẺ TỔNG QUAN (SNAPSHOT) ====================== */
        .xb-snap {
            background: linear-gradient(140deg, #ffffff 0%, #fff6fb 55%, #f7f1ff 100%);
            border: 1px solid var(--pink-200); border-radius: var(--r-xl); padding: 18px 17px;
            box-shadow: var(--sh-m); margin-bottom: 18px; position: relative; overflow: hidden;
        }
        @media (min-width: 640px) { .xb-snap { padding: 22px 24px; } }
        .xb-snap::after { content: ''; position: absolute; width: 190px; height: 190px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,182,213,.35), transparent 70%); top: -70px; right: -50px; }
        .xb-snap-top { display: flex; align-items: center; gap: 12px; position: relative; }
        .xb-ava {
            width: 54px; height: 54px; flex: 0 0 auto; border-radius: 18px; display: grid; place-items: center;
            background: linear-gradient(135deg, #ffc2dd, #d9c2ff); color: #fff;
            font: 700 19px 'Quicksand', sans-serif; box-shadow: 0 8px 18px -8px rgba(236,72,153,.6);
        }
        .xb-snap-name { margin: 0; font-size: 20px; font-weight: 700; color: var(--pink-ink); line-height: 1.2; }
        @media (min-width: 640px) { .xb-snap-name { font-size: 23px; } }
        .xb-snap-sub { margin: 4px 0 0; font-size: 12.5px; color: var(--ink-soft); }
        .xb-ring { width: 52px; height: 52px; flex: 0 0 auto; margin-left: auto; display: grid; place-items: center; position: relative; }
        .xb-ring svg { transform: rotate(-90deg); }
        .xb-ring b { position: absolute; font: 700 12px 'Quicksand', sans-serif; color: var(--pink-600); }

        .xb-dx { margin-top: 15px; background: #fff; border: 1px dashed var(--pink-200); border-radius: var(--r-md);
            padding: 12px 14px; font-size: 13.5px; line-height: 1.6; position: relative; }
        .xb-dx b { color: var(--pink-600); font-weight: 700; }

        .xb-pills { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 15px; position: relative; }
        .xb-pill {
            display: inline-flex; align-items: baseline; gap: 6px; border-radius: 999px; padding: 7px 13px;
            background: #fff; border: 1px solid var(--pink-200); font-size: 12.5px; color: var(--ink-soft);
        }
        .xb-pill b { font-size: 13.5px; color: var(--ink); font-weight: 700; }
        .xb-pill.is-warn { background: #fff6ee; border-color: #ffd2a8; }
        .xb-pill.is-warn b { color: #d2762f; }
        .xb-pill.is-info { background: #f1f8ff; border-color: #c9e2fb; }
        .xb-pill.is-info b { color: #2f7fc6; }
        .xb-pill.is-mint { background: #f0fbf7; border-color: #c8ecdf; }
        .xb-pill.is-mint b { color: #189178; }
        button.xb-pill { cursor: pointer; font-family: inherit; }
        button.xb-pill:active { transform: scale(.96); }

        /* Bảng gom chỉ số bất thường */
        .xb-abn { margin-top: 15px; border: 1px solid #ffd2a8; background: #fffaf5; border-radius: var(--r-md);
            padding: 10px 12px; position: relative; }
        .xb-abn[hidden] { display: none; }
        .xb-abn-h { font: 700 12px 'Be Vietnam Pro', sans-serif; color: #c2681f; text-transform: uppercase;
            letter-spacing: .05em; margin-bottom: 6px; }
        .xb-abn-row { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; border-top: 1px solid #ffe6d2;
            font-size: 13px; cursor: pointer; }
        .xb-abn-row:first-of-type { border-top: 0; }
        .xb-abn-row .n { flex: 1; min-width: 0; color: var(--ink); }
        .xb-abn-row .n small { color: var(--muted); font-size: 11px; display: block; }
        .xb-abn-row .v { font-weight: 700; white-space: nowrap; }
        .xb-abn-row.is-high .v { color: #d94141; }
        .xb-abn-row.is-low .v { color: #2f7fc6; }
        .xb-abn-row .r { color: var(--muted); font-size: 11.5px; white-space: nowrap; }

        /* ============================ MỤC BỆNH ÁN ============================ */
        #medical-record-view { font-size: var(--fs); }
        .rec-section { scroll-margin-top: 96px; }
        .xb-sec {
            background: var(--ac-bg); border: 1px solid var(--ac-line); border-radius: var(--r-xl);
            margin-bottom: 18px; overflow: hidden; box-shadow: var(--sh-s); transition: border-color .18s, box-shadow .18s;
        }
        .xb-sec:hover { box-shadow: var(--sh-m); }
        .xb-sec.is-flash { animation: flash 1.1s ease-out; }
        @keyframes flash { 0%,100% { box-shadow: var(--sh-s); } 30% { box-shadow: 0 0 0 4px var(--ac-line); } }
        button.xb-sec-head {
            width: 100%; display: flex; align-items: center; gap: 11px; padding: 16px 17px; border: 0; cursor: pointer;
            background: transparent; text-align: left; font-family: inherit;
        }
        @media (min-width: 640px) { button.xb-sec-head { padding: 17px 20px; } }
        .xb-sec-ic {
            width: 34px; height: 34px; flex: 0 0 auto; border-radius: 12px; display: grid; place-items: center;
            background: var(--ac-chip); color: var(--ac-ink); font-size: 14px;
        }
        .xb-sec-t { flex: 1; min-width: 0; font: 700 15px 'Quicksand', sans-serif; color: var(--ac-ink); line-height: 1.25; }
        @media (min-width: 640px) { .xb-sec-t { font-size: 16.5px; } }
        .xb-chev { color: var(--ac-ink); opacity: .55; font-size: 13px; transition: transform .2s; }
        .xb-sec.is-closed .xb-chev { transform: rotate(-90deg); }
        .xb-sec.is-closed .xb-sec-body { display: none; }
        .xb-sec-body { padding: 2px 17px 18px; }
        @media (min-width: 640px) { .xb-sec-body { padding: 2px 20px 20px; } }
        /* Khoảng cách giữa các đoạn trong cùng một ô */
        .xb-sec-body > * + * { margin-top: 15px; }

        .xb-f { line-height: 1.75; }
        .field-label { font-weight: 700; color: var(--ac-ink); }
        .field-value { color: var(--ink); white-space: pre-line; overflow-wrap: anywhere; }
        .xb-f a { color: var(--pink-600); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
        /* Mục Hành chính toàn dòng ngắn -> xếp 2 cột cho gọn */
        .sec-grid { display: grid; gap: 13px 28px; }
        @media (min-width: 640px) { .sec-grid { grid-template-columns: 1fr 1fr; } }
        .sec-grid > * + * { margin-top: 0; }   /* đã có gap của grid, cộng thêm margin là hở gấp đôi */

        .xb-cap { font: 700 11.5px 'Be Vietnam Pro', sans-serif; color: var(--ac-ink); opacity: .8;
            text-transform: uppercase; letter-spacing: .04em; }
        /* Nhãn nhóm dính liền với chùm chip/ảnh của nó, không giãn như giữa hai đoạn */
        .xb-cap + .xb-vitals, .xb-cap + .cls-imgs { margin-top: 7px; }
        .vital-chip {
            display: inline-flex; align-items: baseline; gap: 6px; border-radius: 12px; padding: 7px 12px;
            font-size: 13px; background: #fff; border: 1px solid var(--ac-line);
        }
        .vital-chip .lbl { color: var(--muted); font-size: 11px; }
        .vital-chip b { color: var(--ink); }
        .vital-chip.is-warn { background: #fff6ee; border-color: #ffd2a8; }
        .vital-chip.is-warn b { color: #d2762f; }
        .xb-vitals { display: flex; flex-wrap: wrap; gap: 9px; }

        /* Chế độ riêng tư: ô đã che hiện lờ mờ cho biết là đang giấu */
        .xb-masked { background: var(--pink-100); border-radius: 5px; padding: 0 5px; color: var(--pink-ink); font-style: italic; }

        /* ============================ TRẠNG THÁI RỖNG ============================ */
        .xb-empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 54px 18px; }
        .xb-empty-ic { width: 72px; height: 72px; border-radius: 26px; display: grid; place-items: center; margin-bottom: 14px;
            background: linear-gradient(135deg, #ffe1ef, #ece2ff); color: var(--pink-500); font-size: 27px; }
        .xb-empty h2 { margin: 0; font-size: 18px; color: var(--pink-ink); }
        .xb-empty p { margin: 6px 0 0; font-size: 13.5px; color: var(--ink-soft); max-width: 360px; }

        /* ============================ DOCK ĐIỆN THOẠI ============================ */
        .xb-dock {
            position: fixed; z-index: 45; left: 50%; bottom: max(10px, env(safe-area-inset-bottom));
            transform: translateX(-50%); width: min(540px, calc(100% - 16px));
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 7px;
            background: rgba(255,255,255,.93); backdrop-filter: blur(14px);
            border: 1px solid var(--pink-200); border-radius: 24px;
            box-shadow: 0 16px 34px -12px rgba(236,72,153,.45);
        }
        @media (min-width: 960px) { .xb-dock { display: none; } body.xb-body { padding-bottom: 24px; } }
        .xb-dock button {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
            border: 0; background: transparent; border-radius: 17px; padding: 7px 2px; cursor: pointer;
            color: var(--pink-500); font: 600 10px 'Be Vietnam Pro', sans-serif; min-height: 52px;
            white-space: nowrap; overflow: hidden;
        }
        /* Màn hẹp (360px): thu chữ lại chứ không được để rơi mất nhãn */
        @media (max-width: 390px) { .xb-dock button { font-size: 9px; } .xb-dock { padding: 6px; } }
        .xb-dock button i { font-size: 16px; }
        .xb-dock button:active { transform: scale(.93); background: var(--pink-50); }
        .xb-dock .xb-dock-main {
            background: linear-gradient(135deg, #fb92c1, #ef5b9c); color: #fff;
            box-shadow: 0 8px 18px -8px rgba(236,72,153,.8);
        }

        /* ============================ THẺ TRƯỢT ============================ */
        .xb-sheet { position: fixed; inset: 0; z-index: 60; }
        .xb-sheet[hidden] { display: none; }
        .xb-sheet-mask { position: absolute; inset: 0; background: rgba(90,40,65,.4); opacity: 0; transition: opacity .2s; }
        .xb-sheet.is-open .xb-sheet-mask { opacity: 1; }
        .xb-sheet-panel {
            position: absolute; left: 0; right: 0; bottom: 0; background: #fffafc;
            border-radius: 28px 28px 0 0; box-shadow: 0 -14px 40px -12px rgba(236,72,153,.4);
            max-height: 78vh; overflow-y: auto; padding: 10px 16px calc(22px + env(safe-area-inset-bottom));
            transform: translateY(100%); transition: transform .24s cubic-bezier(.2,.9,.3,1);
        }
        .xb-sheet.is-open .xb-sheet-panel { transform: none; }
        @media (min-width: 700px) {
            .xb-sheet-panel { left: 50%; right: auto; bottom: auto; top: 50%; width: 440px; max-height: 82vh;
                border-radius: 26px; transform: translate(-50%, -44%) scale(.96); opacity: 0;
                transition: transform .2s, opacity .2s; padding: 16px 20px 22px; }
            .xb-sheet.is-open .xb-sheet-panel { transform: translate(-50%, -50%); opacity: 1; }
        }
        .xb-grab { width: 44px; height: 5px; border-radius: 5px; background: var(--pink-200); margin: 2px auto 12px; }
        @media (min-width: 700px) { .xb-grab { display: none; } }
        .xb-sheet-title { font: 700 15px 'Quicksand', sans-serif; color: var(--pink-ink); margin: 0 0 10px; }
        .xb-menu { display: grid; gap: 6px; }
        .xb-menu button, .xb-menu a {
            display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px; border-radius: 16px;
            border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer;
            font: 600 14px 'Be Vietnam Pro', sans-serif; text-align: left; text-decoration: none;
        }
        .xb-menu button:active, .xb-menu a:active { background: var(--pink-50); }
        .xb-menu i { width: 22px; text-align: center; color: var(--pink-500); font-size: 15px; }
        /* Sửa là việc chính -> nổi hẳn lên đầu thẻ trượt */
        .xb-menu a.xb-menu-main { background: linear-gradient(135deg, #fb92c1, #ef5b9c); border-color: transparent;
            color: #fff; box-shadow: 0 10px 22px -10px rgba(236,72,153,.8); padding: 15px 14px; }
        .xb-menu a.xb-menu-main i, .xb-menu a.xb-menu-main small { color: #fff; opacity: .92; }
        .xb-menu small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); margin-top: 1px; }
        .xb-row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 16px;
            border: 1px solid var(--line); background: #fff; margin-bottom: 6px; }
        .xb-row .lbl { flex: 1; font: 600 14px 'Be Vietnam Pro', sans-serif; }
        .xb-step { display: flex; align-items: center; gap: 4px; }
        .xb-step button { width: 34px; height: 34px; border-radius: 11px; border: 1px solid var(--pink-200);
            background: var(--pink-50); color: var(--pink-600); font: 700 14px 'Quicksand', sans-serif; cursor: pointer; }
        .xb-step span { min-width: 34px; text-align: center; font: 700 12px 'Be Vietnam Pro', sans-serif; color: var(--ink-soft); }
        .xb-switch { width: 50px; height: 29px; border-radius: 999px; border: 0; background: var(--pink-200);
            position: relative; cursor: pointer; transition: background .18s; flex: 0 0 auto; }
        .xb-switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 23px; height: 23px;
            border-radius: 50%; background: #fff; transition: transform .18s; box-shadow: 0 2px 5px rgba(0,0,0,.18); }
        .xb-switch.is-on { background: linear-gradient(135deg, #fb92c1, #ef5b9c); }
        .xb-switch.is-on::after { transform: translateX(21px); }

        /* ============================ CHẾ ĐỘ TRÌNH BỆNH ============================ */
        #present { position: fixed; inset: 0; z-index: 70; background: linear-gradient(160deg, #fff8fc, #fdeef7 50%, #f4efff);
            display: flex; flex-direction: column; }
        #present[hidden] { display: none; }
        .pr-top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
        .pr-top .who { flex: 1; min-width: 0; font: 700 13px 'Quicksand', sans-serif; color: var(--pink-ink);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pr-count { font: 700 12px 'Be Vietnam Pro', sans-serif; color: var(--muted); }
        .pr-body { flex: 1; overflow-y: auto; padding: 16px 14px 8px; }
        @media (min-width: 700px) { .pr-body { padding: 26px max(24px, calc(50% - 380px)) 10px; } }
        .pr-body .xb-sec { background: transparent; border: 0; box-shadow: none; margin: 0; }
        .pr-body .xb-sec-body { padding: 0; font-size: calc(var(--fs) + 2.5px); line-height: 1.75; }
        .pr-body button.xb-sec-head { padding: 0 0 14px; pointer-events: none; }
        .pr-body .xb-sec-t { font-size: 20px; }
        .pr-body .xb-chev { display: none; }
        .pr-nav { display: flex; align-items: center; gap: 10px; padding: 10px 14px calc(14px + env(safe-area-inset-bottom)); }
        .pr-nav button { flex: 0 0 auto; width: 52px; height: 46px; border-radius: 16px; border: 1px solid var(--pink-200);
            background: #fff; color: var(--pink-500); font-size: 16px; cursor: pointer; }
        .pr-nav button:disabled { opacity: .35; }
        .pr-dots { flex: 1; display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
        .pr-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--pink-200); }
        .pr-dots i.on { background: var(--pink-500); width: 18px; border-radius: 4px; }

        /* ============================ PHIẾU CẬN LÂM SÀNG ============================ */
        .cls-card { background: #fff; border: 1px solid var(--ac-line); border-radius: 18px; padding: 14px 15px; margin-bottom: 14px; }
        .cls-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; margin-bottom: 8px; }
        .cls-title { font-weight: 700; color: var(--ac-ink); font-family: 'Quicksand', sans-serif; }
        .cls-group { font-size: 10.5px; font-weight: 700; color: #7255cf; background: #f0eaff; border-radius: 999px; padding: 2px 9px; }
        .cls-date { font-size: 11.5px; color: var(--muted); margin-left: auto; }
        .cls-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .cls-table th { text-align: left; font-size: 9.5px; text-transform: uppercase; color: var(--muted);
            font-weight: 700; padding: 3px 6px; border-bottom: 1px solid var(--line); letter-spacing: .04em; }
        .cls-table td { padding: 5px 6px; border-bottom: 1px solid #fff2f8; }
        .cls-table .cls-v { white-space: nowrap; }
        .cls-table .cls-u, .cls-table .cls-r { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
        .cls-abn .cls-v b, .cls-flag { font-weight: 800; }
        tr.cls-abn.is-high .cls-v b, tr.cls-abn.is-high .cls-flag { color: #d94141; }
        tr.cls-abn.is-low  .cls-v b, tr.cls-abn.is-low  .cls-flag { color: #2f7fc6; }
        tr.cls-abn.is-high { background: #fff6f6; }
        tr.cls-abn.is-low  { background: #f4f9ff; }
        .cls-note { margin-top: 8px; font-size: 13px; color: var(--ink); white-space: pre-line; }
        .cls-imgs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .cls-fig { margin: 0; width: 148px; }
        .cls-img { width: 148px; height: 112px; object-fit: cover; border-radius: 14px;
            border: 1px solid var(--ac-line); cursor: zoom-in; display: block; }
        .cls-fig figcaption { font-size: 11px; color: var(--ink-soft); margin-top: 3px; text-align: center; }
        /* Bảng CLS trên điện thoại: cho cuộn ngang trong khung riêng, không đẩy cả trang */
        @media (max-width: 480px) {
            .cls-card { overflow-x: auto; }
            .cls-table { min-width: 320px; }
        }

        /* ============================ XEM ẢNH TO ============================ */
        .lightbox { position: fixed; inset: 0; z-index: 80; background: rgba(40,15,28,.94);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; }
        .lightbox[hidden] { display: none; }
        .lightbox img { max-width: 100%; max-height: 84vh; object-fit: contain; border-radius: 12px; }
        .lightbox-cap { color: #ffe9f3; font-size: 13px; text-align: center; margin: 0; }
        .lightbox-x { position: absolute; top: max(14px, env(safe-area-inset-top)); right: 16px; background: rgba(255,255,255,.16);
            color: #fff; border: 0; border-radius: 999px; width: 44px; height: 44px; font-size: 18px; cursor: pointer; }

        footer.xb-foot { text-align: center; color: var(--pink-300); font-size: 11.5px; padding: 8px 0 18px; }

        /* ============================ IN / XUẤT PDF (A4) ============================ */
        .print-head, .print-sign { display: none; }
        @media print {
            @page { size: A4; margin: 16mm 14mm; }
            .no-print, header.xb-top, footer.xb-foot, .xb-dock, aside.xb-toc,
            .xb-sheet, #present, .xb-bg, .xb-snap, .lightbox { display: none !important; }
            html, body.xb-body { background: #fff !important; padding: 0 !important; }
            body.xb-body { font-family: 'Times New Roman', serif; font-size: 11.5pt; color: #000; line-height: 1.45; }
            .xb-wrap { display: block; padding: 0 !important; max-width: 100% !important; }
            main.xb-main { box-shadow: none !important; border: 0 !important; padding: 0 !important; margin: 0 !important; }
            #medical-record-view { font-size: 11.5pt; }
            /* Mục đang thu gọn vẫn phải in ra đủ — nhưng đừng ép display:block cho
               cả .sec-grid, không thì mục Hành chính rơi từ 2 cột xuống 1 cột */
            .xb-sec { display: block !important; }
            .xb-sec.is-closed .xb-sec-body { display: block !important; }
            .xb-sec.is-closed .xb-sec-body.sec-grid { display: grid !important; }
            .xb-sec { background: #fff !important; border: 0 !important; box-shadow: none !important;
                border-radius: 0 !important; padding: 0 !important; margin: 0 0 9pt 0 !important; break-inside: avoid; }
            .xb-sec-body { padding: 0 !important; }
            button.xb-sec-head { padding: 0 !important; }
            .xb-sec-ic, .xb-chev, .cls-group { display: none !important; }
            .xb-sec-t { color: #000 !important; font-family: 'Times New Roman', serif; font-weight: 700;
                font-size: 11.5pt !important; border-bottom: 1px solid #000; padding-bottom: 2pt; width: 100%; }
            .print-head, .print-sign { display: block !important; }
            .print-sign { break-inside: avoid; }
            .field-label, .field-value, .cls-title, .xb-cap, .xb-f a { color: #000 !important; }
            .xb-f a { text-decoration: none; }
            .vital-chip, .vital-chip .lbl, .vital-chip b { color: #000 !important; }
            .vital-chip { border: 1px solid #666 !important; background: #fff !important; border-radius: 3px; }
            .vital-chip i { display: none !important; }
            mark.xb-hit { background: transparent !important; color: inherit !important; }
            .sec-grid { grid-template-columns: 1fr 1fr; }
            .cls-card { border: 1px solid #999 !important; background: #fff !important; break-inside: avoid;
                padding: 6pt 8pt !important; border-radius: 0; overflow: visible !important; }
            .cls-table th, .cls-table td { border-bottom: 1px solid #ccc !important; }
            .cls-abn .cls-v b { color: #000 !important; text-decoration: underline; }
            tr.cls-abn { background: #f2f2f2 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .cls-fig { width: 46%; }
            .cls-img { width: 100%; height: auto; max-height: 80mm; object-fit: contain; break-inside: avoid; border-radius: 0; }
        }
    </style>
</head>
<body class="xb-body">

<div class="xb-bg" aria-hidden="true"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div>

<!-- ================================ THANH TRÊN ================================ -->
<header class="xb-top no-print">
    <div class="xb-top-in">
        <a href="../study-room/waiting-room.html" class="xb-ib" title="Danh sách bệnh án"><i class="fas fa-arrow-left"></i></a>
        <div class="xb-title">
            <h1 id="head-name">Xem bệnh án</h1>
            <p id="head-meta"></p>
        </div>

        <div class="xb-tools">
            <button id="search-btn" class="xb-ib" title="Tìm trong bệnh án (Ctrl+F)"><i class="fas fa-magnifying-glass"></i></button>
            <button id="present-btn" class="xb-btn" title="Trình bệnh từng mục một, chữ to, vuốt để chuyển"><i class="fas fa-chalkboard-user"></i>Trình bệnh</button>
            <button id="print-btn" class="xb-btn"><i class="fas fa-print"></i>In / PDF</button>
            <button class="xb-btn" data-sheet="more" title="Xuất file & tùy chọn hiển thị"><i class="fas fa-ellipsis"></i>Thêm</button>
            <a id="edit-record-btn" href="#" class="xb-btn xb-primary" hidden><i class="fas fa-pen"></i>Sửa bệnh án</a>
        </div>

        <!-- Sửa là việc hay làm nhất -> trên điện thoại luôn có nút riêng ở thanh trên,
             ngoài nút giữa dock, khỏi phải mở thẻ trượt mới tìm thấy. -->
        <a id="edit-top-mobile" href="#" class="xb-edit-pill xb-only-mobile" title="Sửa bệnh án" hidden><i class="fas fa-pen"></i>Sửa</a>
    </div>

    <div id="search-bar" class="xb-search">
        <div class="xb-search-in">
            <i class="fas fa-magnifying-glass"></i>
            <input id="search-input" type="search" placeholder="Tìm trong bệnh án… (gõ không dấu cũng ra)" autocomplete="off">
            <span id="search-count"></span>
            <button id="search-prev" title="Kết quả trước"><i class="fas fa-chevron-up"></i></button>
            <button id="search-next" title="Kết quả sau"><i class="fas fa-chevron-down"></i></button>
            <button id="search-close" title="Đóng"><i class="fas fa-xmark"></i></button>
        </div>
    </div>

    <div class="xb-read"><span id="read-bar"></span></div>
</header>

<div class="xb-wrap">
    <!-- Mục lục cột bên (màn rộng) -->
    <aside class="xb-toc no-print">
        <div class="xb-toc-box">
            <p class="xb-toc-cap">Mục lục</p>
            <nav id="toc-nav"></nav>
        </div>
    </aside>

    <main class="xb-main fade-in">
        <!-- Tiêu đề chỉ hiện khi in -->
        <div class="print-head" style="text-align:center;margin-bottom:14pt">
            <div style="font-weight:700;font-size:13pt;text-transform:uppercase">Bệnh án</div>
            <div id="print-sub" style="font-size:10pt;margin-top:3pt"></div>
        </div>

        <div id="snapshot" class="no-print"></div>
        <div id="medical-record-view"></div>

        <div class="print-sign" style="margin-top:20pt;text-align:right">
            <div id="sign-date" style="font-style:italic"></div>
            <div style="font-weight:700;margin-top:4pt">Người làm bệnh án</div>
            <div style="font-size:9pt;font-style:italic">(Ký, ghi rõ họ tên)</div>
            <div id="sign-name" style="margin-top:40pt;font-weight:600"></div>
        </div>
    </main>
</div>

<footer class="xb-foot no-print">© 2025 Zitthenkne · Bệnh án điện tử</footer>

<!-- ================================ DOCK ĐIỆN THOẠI ================================ -->
<nav class="xb-dock no-print" id="dock">
    <button data-sheet="toc"><i class="fas fa-list-ul"></i>Mục lục</button>
    <button data-act="search"><i class="fas fa-magnifying-glass"></i>Tìm</button>
    <button class="xb-dock-main" data-act="edit"><i class="fas fa-pen"></i>Sửa</button>
    <button data-act="present"><i class="fas fa-chalkboard-user"></i>Trình bệnh</button>
    <button data-sheet="more"><i class="fas fa-ellipsis"></i>Thêm</button>
</nav>

<!-- ================================ THẺ TRƯỢT ================================ -->
<div class="xb-sheet no-print" id="sheet-toc" hidden>
    <div class="xb-sheet-mask" data-close></div>
    <div class="xb-sheet-panel">
        <div class="xb-grab"></div>
        <p class="xb-sheet-title">Mục lục bệnh án</p>
        <nav id="toc-nav-mobile"></nav>
    </div>
</div>

<div class="xb-sheet no-print" id="sheet-more" hidden>
    <div class="xb-sheet-mask" data-close></div>
    <div class="xb-sheet-panel">
        <div class="xb-grab"></div>
        <div class="xb-menu" style="margin-bottom:14px">
            <a id="edit-link-mobile" href="#" class="xb-menu-main" hidden><i class="fas fa-pen"></i><span>Sửa bệnh án<small>Mở lại trang nhập liệu</small></span></a>
        </div>
        <p class="xb-sheet-title">Xuất bệnh án</p>
        <div class="xb-menu" style="margin-bottom:16px">
            <button data-act="copy"><i class="fas fa-copy"></i><span>Sao chép<small>Dán thẳng vào Google Docs / Word, giữ nguyên định dạng</small></span></button>
            <button data-act="print"><i class="fas fa-print"></i><span>In / Lưu PDF<small>Khổ A4, có sẵn khối ký tên</small></span></button>
            <button data-act="word"><i class="fas fa-file-word"></i><span>Tải file .doc<small>Mở bằng Word</small></span></button>
            <button data-act="txt"><i class="fas fa-file-lines"></i><span>Tải file .md<small>Kéo vào Drive là ra heading sẵn</small></span></button>
            <button data-act="share" id="share-btn" hidden><i class="fas fa-share-nodes"></i><span>Chia sẻ<small>Gửi qua Zalo, Messenger…</small></span></button>
        </div>
        <p class="xb-sheet-title">Hiển thị</p>
        <div class="xb-row">
            <span class="lbl">Cỡ chữ</span>
            <span class="xb-step">
                <button id="fs-down" title="Nhỏ lại">A−</button>
                <span id="fs-val">100%</span>
                <button id="fs-up" title="To lên">A+</button>
            </span>
        </div>
        <div class="xb-row">
            <span class="lbl">Chế độ riêng tư<small style="display:block;font-weight:400;font-size:11.5px;color:var(--muted)">Che tên, địa chỉ, số điện thoại — che cả khi in</small></span>
            <button id="private-switch" class="xb-switch" role="switch" aria-checked="false"></button>
        </div>
        <div class="xb-row">
            <span class="lbl">Thu gọn tất cả mục</span>
            <button id="fold-switch" class="xb-switch" role="switch" aria-checked="false"></button>
        </div>
    </div>
</div>

<!-- ================================ TRÌNH BỆNH ================================ -->
<div id="present" class="no-print" hidden>
    <div class="pr-top">
        <span class="who" id="pr-who"></span>
        <span class="pr-count" id="pr-count"></span>
        <button class="xb-ib" id="pr-exit" title="Thoát (Esc)"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="pr-body" id="pr-body"></div>
    <div class="pr-nav">
        <button id="pr-prev" title="Mục trước"><i class="fas fa-chevron-left"></i></button>
        <div class="pr-dots" id="pr-dots"></div>
        <button id="pr-next" title="Mục sau"><i class="fas fa-chevron-right"></i></button>
    </div>
</div>

<!-- ================================ XEM ẢNH TO ================================ -->
<div id="lightbox" class="lightbox no-print" hidden>
    <button class="lightbox-x" aria-label="Đóng"><i class="fas fa-xmark"></i></button>
    <img alt="Ảnh cận lâm sàng">
    <p class="lightbox-cap"></p>
</div>

<div id="toast-container" class="fixed bottom-28 sm:bottom-6 right-4 z-[90] flex flex-col items-end space-y-2 pointer-events-none"></div>

<script type="module" src="xem-benh-an.js"></script>
</body>
</html>
